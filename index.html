        info: quiet ? '' : state.info,
        error: '',
        buzzDevice: net.buzzDevice,
        searcherId: net.searcherId,
        searchers: net.searchers || [],
        hold: state.holdingSfx,
        scoredPid: extra && extra.scoredPid,
        revokePid: extra && extra.revokePid,
        round: round
      });
    }

    function publish(extra) {
      const payload = hostPayload(extra || null);
      if (payload) cast(payload);
    }

    function saveOrder() {
      const logic = mpLogic();
      if (!logic) return;
      const raw = JSON.stringify({
        v: 1,
        locked: net.locked.map((id) => String(id)),
        seen: net.seen.map((id) => String(id))
      });
      writeLocalRaw(logic.ORDER_KEY, raw);
      if (!isGuest() && !browserGuestShell()) writeBridgeRaw(logic.ORDER_KEY, raw);
    }

    async function loadOrder() {
      const logic = mpLogic();
      if (!logic) return;
      let raw = null;
      if (isGuest() || browserGuestShell() || !persistentStore()) {
        try { raw = localStorage.getItem(logic.ORDER_KEY); } catch (error) { raw = null; }
      } else {
        raw = await readStored(logic.ORDER_KEY, function () {});
      }
      const parsed = logic.normalizeOrder(parseSaved(raw));
      net.locked = parsed.locked;
      net.seen = parsed.seen;
      if (!net.clock) net.clock = logic.createClock();
      if (!net.buzz) net.buzz = logic.openBuzz();
    }

    function applyPick(id) {
      const player = playerById(Number(id));
      if (!player || player.id === currentDjId()) return;
      state.guesserId = player.id;
      state.phase = 'mark';
      net.confirmJudge = '';
      publish();
      render();
    }

    function captureUndo() {
      return {
        players: state.players.map((player) => ({ id: player.id, score: player.score })),
        phase: state.phase,
        guesserId: state.guesserId,
        notice: state.notice,
        round: state.round ? JSON.parse(JSON.stringify(state.round)) : null,
        locked: net.locked.slice(),
        positionMs: state.round ? (Number(state.round.positionMs) || 0) : 0
      };
    }

    async function undoJudgement() {
      const snap = net.undo;
      if (!snap || !isHost()) return;
      const revoked = snap.locked.length < net.locked.length ? net.locked[net.locked.length - 1] : '';
      net.undo = null;
      beginTransportTurn();
      state.players.forEach((player) => {
        const old = snap.players.find((item) => item.id === player.id);
        if (old) player.score = old.score;
      });
      state.phase = 'mark';
      state.guesserId = snap.guesserId;
      state.notice = '';
      state.round = snap.round;
      state.holdingSfx = false;
      state.transportPaused = true;
      net.locked = snap.locked.slice();
      net.pickedLocal = false;
      saveOrder();
      try {
        const api = requireApi();
        await api.pause();
        if (snap.positionMs > 0 && api.seek) await api.seek(snap.positionMs);
      } catch (error) {
        presentError(error);
      }
      publish({ revokePid: revoked ? String(revoked) : '' });
      render();
    }

    function paintDeferred(work) {
      if (!net.finger) {
        work();
        return;
      }
      let done = false;
      const run = () => {
        if (done) return;
        done = true;
        net.finger = false;
        work();
      };
      window.addEventListener('pointerup', run, { capture: true, once: true });
      window.addEventListener('touchend', run, { capture: true, once: true });
      setTimeout(run, 480);
    }

    let pauseFlight = Promise.resolve();

    function pauseForBuzz() {
      let pauseCall;
      try { pauseCall = requireApi().pause(); }
      catch (error) { pauseCall = Promise.reject(error); }
      playBuzzerImmediate();
      buzzHaptic();
      net.hostPaused = true;
      pauseFlight = pauseCall.then(function () {}, function (error) { presentError(error); });
      return pauseFlight;
    }

    function releasePausedRound() {
      net.localLock = false;
      net.pressedBuzz = false;
      net.buzzDevice = '';
      net.hostPaused = false;
      if (state.round) state.round.lock = false;
      const resume = function () {
        if (net.buzzDevice || state.phase !== 'playing') return;
        restorePlayback().then(function () {}, function (error) { presentError(error); });
      };
      pauseFlight.then(resume, resume);
    }

    function armDecision() {
      const logic = mpLogic();
      clearTimeout(net.buzzTimer);
      const wait = logic ? logic.DECISION_MS : 60;
      const since = net.buzz && net.buzz.since ? net.buzz.since : Date.now();
      net.buzzTimer = setTimeout(finishDecision, Math.max(0, since + wait - Date.now()));
    }

    function noteBuzz(device, seq, at) {
      const logic = mpLogic();
      if (!logic) return;
      if (!net.buzz || !net.buzz.open) net.buzz = logic.openBuzz();
      const taken = logic.takeBuzz(net.buzz, { device: device, seq: seq, at: at }, Date.now());
      if (!taken.ok) {
        if (taken.reason === 'closed') sendTo(device, { t: 'reject' });
        return;
      }
      if (taken.first) {
        cast({ t: 'lock' });
        armDecision();
      }
    }

    function finishDecision() {
      const logic = mpLogic();
      if (!isHost() || !logic || !net.buzz) return;
      const result = logic.settleBuzz(net.buzz, Date.now());
      if (!result) {
        if (net.buzz.open && net.buzz.buzzes.length) armDecision();
        return;
      }
      if (result.kind !== 'win' || !result.device) {
        state.notice = 'Gleichstand, knapp zusammen. Niemand bekommt den Tipp.';
        state.phase = 'playing';
        net.buzz = logic.openBuzz();
        cast({ t: 'tie' });
        releasePausedRound();
        publish();
        render();
        return;
      }
      net.buzzDevice = result.device;
      state.guesserId = null;
      state.phase = 'guess';
      net.confirmJudge = '';
      if (state.round) {
        state.round.lock = true;
        state.round.pendingSec = buzzSeconds(state.round);
      }
      if (String(result.device) !== String(net.selfId)) pauseForBuzz();
      publish();
      applyBuzzFace();
      paintDeferred(function () { render(); });
    }

    function netBuzz() {
      const round = state.round;
      if (!round || state.phase !== 'playing' || round.lock || state.holdingSfx || net.localLock) return;
      const logic = mpLogic();
      if (!logic) return;
      net.localLock = true;
      net.pressedBuzz = true;
      net.finger = true;
      net.buzzSeq += 1;
      const offset = isHost() || !net.clock ? 0 : logic.clockOffset(net.clock);
      const packet = { seq: net.buzzSeq, at: Date.now() + offset };
      applyBuzzFace();
      if (isGuest()) {
        sendHost({ t: 'buzz', seq: packet.seq, at: packet.at });
        return;
      }
      pauseForBuzz();
      noteBuzz(net.selfId, packet.seq, packet.at);
    }

    function applyGuest(msg) {
      if (!msg || msg.t !== 'state' || !isGuest()) return;
      const logic = mpLogic();
      if (msg.revokePid && logic) {
        net.locked = logic.unlockLast(net.locked, msg.revokePid);
        net.pickedLocal = true;
        saveOrder();
      }
      if (msg.scoredPid && net.pickedLocal && logic) {
        net.locked = logic.lockIn(net.locked, msg.scoredPid);
        net.pickedLocal = false;
        saveOrder();
      }
      const players = (msg.players || []).map((player) => ({
        id: Number(player.id),
        pid: player.pid || '',
        first: player.first || player.name || '',
        last: player.tag || player.last || '',
        name: player.name || player.first || '',
        tag: player.tag || '',
        score: Number(player.score) || 0
      })).filter((player) => player.id);
      if (players.length) {
        state.players = players;
        state.nextId = players.reduce((max, player) => Math.max(max, player.id), 0) + 1;
      }
      if (Array.isArray(msg.directory) && msg.directory.length) net.directory = msg.directory;
      const keepSearch = net.localSearch && (msg.phase === 'dj' || msg.phase === 'search');
      net.localSearch = keepSearch;
      state.phase = keepSearch ? 'dj' : (msg.phase || 'setup');
      if (state.phase !== 'dj') net.djSent = false;
      state.djId = msg.djId == null ? null : Number(msg.djId);
      state.guesserId = msg.guesserId == null ? null : Number(msg.guesserId);
      state.songsStarted = Number(msg.songsStarted) || 0;
      state.notice = msg.notice || '';
      state.info = msg.info === 'Wer das Handy hält, ist der DJ und sucht den Song aus.' ? '' : (msg.info || '');
      if (msg.error) state.error = msg.error;
      else if (!keepSearch) state.error = '';
      state.holdingSfx = Boolean(msg.hold);
      net.buzzDevice = msg.buzzDevice || '';
      net.searcherId = msg.searcherId || '';
      net.searchers = Array.isArray(msg.searchers) ? msg.searchers : [];
      if (!msg.round) state.round = null;
      else {
        state.round = {
          djId: msg.round.djId == null ? null : Number(msg.round.djId),
          uri: '',
          secretTitle: msg.round.secretTitle || '',
          secretArtist: msg.round.secretArtist || '',
          durationMs: 0,
          lock: Boolean(msg.round.lock),
          outcome: msg.round.outcome || '',
          outcomeWho: msg.round.outcomeWho || '',
          unconfirmed: Boolean(msg.round.unconfirmed),
          startedAt: 0,
          pendingSec: null
        };
        state.transportPaused = Boolean(msg.round.paused);
      }
      if (!keepSearch) {
        state.results = [];
        state.recommendations = [];
        state.picked = null;
        state.recsReady = false;
        state.recsLoading = false;
      }
      state.busy = false;
      net.localLock = Boolean(msg.hold) || (state.phase === 'playing' && state.round && state.round.lock);
      if (state.phase !== 'guess' && state.phase !== 'mark') {
        if (!(state.phase === 'playing' && state.round && state.round.lock)) net.pressedBuzz = false;
      }
      if (state.phase === 'guess' && !state.guesserId) net.confirmJudge = '';
      if (booting) {
        net.pendingState = null;
        return;
      }
      const mine = String(net.buzzDevice) === String(net.selfId);
      if (net.finger && (mine && (state.phase === 'guess' || state.phase === 'mark') || (net.pressedBuzz && !buzzLitNow()))) {
        applyBuzzFace();
        paintDeferred(function () { render(); });
      } else render();
    }

    function onGuestPacket(data) {
      if (!data) return;
      if (data.t === 'state') {
        if (booting) net.pendingState = data;
        else applyGuest(data);
        return;
      }
      if (data.t === 'lock') {
        net.localLock = true;
        if (state.round) state.round.lock = true;
        applyBuzzFace();
        return;
      }
      if (data.t === 'tie') {
        net.localLock = false;
        net.pressedBuzz = false;
        net.finger = false;
        if (state.round) state.round.lock = false;
        state.notice = 'Gleichstand, knapp zusammen. Niemand bekommt den Tipp.';
        render();
        return;
      }
      if (data.t === 'reject' && state.phase === 'playing' && !state.holdingSfx) {
        net.localLock = false;
        net.pressedBuzz = false;
        applyBuzzFace();
        render();
        return;
      }
      if (data.t === 'pong' && net.clock) {
        const logic = mpLogic();
        const t4 = Date.now();
        if (logic) logic.pushSample(net.clock, logic.ntpOffset(data.t1, data.t2, data.t3, t4), logic.ntpDelay(data.t1, data.t2, data.t3, t4));
        return;
      }
      if (data.t === 'results' && data.id === net.searchWait) {
        state.busy = false;
        state.results = Array.isArray(data.tracks) ? data.tracks.filter((track) => track && track.uri) : [];
        state.picked = null;
        state.info = state.results.length ? 'Tipp einen Song an und dann auf Los.' : 'Nichts gefunden. Versuch einen anderen Suchbegriff.';
        render();
        return;
      }
      if (data.t === 'recs' && data.id === net.recWait) {
        state.recsLoading = false;
        state.recommendations = Array.isArray(data.tracks) ? data.tracks : [];
        state.recsReady = true;
        state.recsNote = state.recommendations.length ? '' : 'Keine passenden Empfehlungen.';
        render();
        return;
      }
      if (data.t === 'no') {
        state.busy = false;
        state.recsLoading = false;
        presentError(data.text || 'Geht gerade nicht.');
        render();
      }
    }

    async function onHostPacket(from, data) {
      if (!data) return;
      if (data.t === 'hello' || data.t === 'ping') {
        if (data.t === 'ping') sendTo(from, { t: 'pong', n: data.n, t1: data.t1, t2: Date.now(), t3: Date.now() });
        if (data.t === 'hello') sendTo(from, hostPayload());
        return;
      }
      if (data.t === 'buzz') {
        if (state.holdingSfx || state.phase !== 'playing') {
          sendTo(from, { t: 'reject' });
          return;
        }
        noteBuzz(from, data.seq, data.at);
        return;
      }
      net.replyTo = from || '';
      try {
        if (data.t === 'add') await addSavedPlayer(data.pid);
        else if (data.t === 'create') await createAndAdd({ first: data.first, last: data.last });
        else if (data.t === 'rename') await renamePlayer(Number(data.id), data.first, data.last);
        else if (data.t === 'remove') await removePlayer(Number(data.id));
        else if (data.t === 'start') await startGame();
        else if (data.t === 'dj') {
          if (state.phase === 'dj' || state.phase === 'search') {
            noteSearcher(from, Number(data.id));
            publish();
            render();
          }
        } else if (data.t === 'back') {
          if ((state.phase === 'dj' || state.phase === 'search') && (net.searchers || []).some((row) => String(row.device) === String(from))) {
            dropSearcher(from);
            publish();
            render();
          } else backName();
        }
        else if (data.t === 'back-ended') backName();
        else if (data.t === 'searching') {
          if (state.phase === 'search') {
            net.searcherId = String(from || '');
            publish();
            render();
          }
        } else if (data.t === 'search') await answerSearch(from, data);
        else if (data.t === 'recs') await answerRecs(from, data);
        else if (data.t === 'los') await answerLos(from, data);
        else if (data.t === 'pick') {
          if (state.phase === 'guess' && String(net.buzzDevice) === String(from)) applyPick(data.id);
        } else if (data.t === 'judge') {
          if (state.phase === 'mark') {
            if (data.id) state.guesserId = Number(data.id);
            await judge(Boolean(data.correct));
          }
        } else if (data.t === 'mistake') await resumeMistake();
        else if (data.t === 'skip') await skipSong();
        else if (data.t === 'ended-yes') endedYes();
        else if (data.t === 'ended-no') endedNo();
        else if (data.t === 'ended-who') {
          state.guesserId = Number(data.id);
          confirmEndedWho();
        } else if (data.t === 'next') nextDj();
        else if (data.t === 'end') await finishGame();
        else if (data.t === 'home') await returnToLobby();
      } finally {
        net.replyTo = '';
      }
    }

    async function answerSearch(from, data) {
      if (state.phase !== 'dj' && state.phase !== 'search') return;
      const query = String(data.q || '').trim();
      if (!query) {
        sendTo(from, { t: 'no', id: data.id, text: 'Suchbegriff fehlt.' });
        return;
      }
      try {
        await ensureReady();
        const found = await requireApi().search(query, { types: ['track'], limit: 8 });
        sendTo(from, { t: 'results', id: data.id, tracks: normalizeTracks(found).map(slimTrack).filter(Boolean) });
      } catch (error) {
        sendTo(from, { t: 'no', id: data.id, text: errText(error) });
      }
    }

    async function answerRecs(from, data) {
      if (state.phase !== 'dj' && state.phase !== 'search') return;
      try {
        const picks = await buildRecommendations();
        picks.forEach((track) => rememberShown(track.uri));
        sendTo(from, { t: 'recs', id: data.id, tracks: picks.map(slimTrack).filter(Boolean) });
      } catch (error) {
        sendTo(from, { t: 'no', id: data.id, text: errText(error) });
      }
    }

    async function answerLos(from, data) {
      if (!data.track || net.acceptingLos || (state.phase !== 'dj' && state.phase !== 'search')) {
        sendTo(from, { t: 'no', text: 'Der Song kann gerade nicht starten.' });
        return;
      }
      const row = (net.searchers || []).find((item) => String(item.device) === String(from));
      if (row) state.djId = row.djId;
      state.picked = data.track;
      net.acceptingLos = true;
      try { await los(); } finally { net.acceptingLos = false; }
      if (state.phase === 'search' && state.error) {
        sendTo(from, { t: 'no', text: state.error });
        if (String(net.searcherId) !== String(net.selfId)) state.error = '';
      }
    }

    function onNetMessage(message) {
      const data = message && message.data;
      const from = message && message.from;
      if (!data || typeof data !== 'object' || !data.t) return;
      if (!net.role) {
        earlyPackets.push({ from: from, data: data });
        return;
      }
      if (isHost()) {
        Promise.resolve(onHostPacket(from, data)).catch((error) => { presentError(error); render(); });
        return;
      }
      if (isGuest()) onGuestPacket(data);
    }

    function flushEarly() {
      const rows = earlyPackets;
      earlyPackets = [];
      rows.forEach((row) => onNetMessage({ from: row.from, data: row.data }));
    }

    function onRoster(roster) {
      if (!roster) return;
      net.devices = Array.isArray(roster.players) ? roster.players : [];
      if (roster.selfId) net.selfId = roster.selfId;
      if (roster.roomCode) net.roomCode = roster.roomCode;
      if (isHost()) {
        const winner = net.devices.find((device) => String(device.id) === String(net.buzzDevice));
        if (state.phase === 'guess' && net.buzzDevice && winner && !winner.connected) {
          net.buzzDevice = net.selfId;
          publish();
        } else {
          const payload = hostPayload();
          net.devices.forEach((device) => {
            if (device.connected && String(device.id) !== String(net.selfId)) sendTo(device.id, payload);
          });
        }
      }
      if (!booting) render();
    }

    function adoptRoom(info) {
      if (!info) return;
      net.role = info.role === 'host' ? 'host' : (info.role === 'guest' ? 'guest' : net.role);
      net.selfId = info.selfId || info.playerId || net.selfId;
      net.roomCode = info.roomCode || net.roomCode;
      if (Array.isArray(info.players)) net.devices = info.players;
      if (info.qrPayload) net.qrPayload = info.qrPayload;
      net.hostAway = info.status === 'hostAway';
      const logic = mpLogic();
      if (logic && !net.clock) net.clock = logic.createClock();
      if (logic && !net.buzz) net.buzz = logic.openBuzz();
      if (isGuest()) startPing();
      else stopPing();
    }

    function stopPing() {
      clearInterval(net.pingTimer);
      net.pingTimer = 0;
    }

    function startPing() {
      stopPing();
      const beat = () => {
        if (!isGuest()) return;
        net.pingN += 1;
        sendHost({ t: 'ping', n: net.pingN, t1: Date.now() });
      };
      beat();
      setTimeout(beat, 250);
      setTimeout(beat, 700);
      net.pingTimer = setInterval(beat, 2000);
    }

    function clearNet() {
      stopPing();
      clearTimeout(net.buzzTimer);
      const logic = mpLogic();
      net.role = '';
      net.panel = false;
      net.detail = '';
      net.hostAway = false;
      net.buzzDevice = '';
      net.pressedBuzz = false;
      net.searcherId = '';
      net.searchers = [];
      net.localSearch = false;
      net.acceptingLos = false;
      net.localLock = false;
      net.hostPaused = false;
      net.confirmJudge = '';
      net.undo = null;
      net.devices = [];
      net.roomCode = '';
      net.qrPayload = '';
      net.selfId = '';
      net.directory = [];
      net.finger = false;
      if (logic) net.buzz = logic.openBuzz();
    }

    function bindMultiplayer() {
      if (net.bound) return;
      const logic = mpLogic();
      if (logic && !net.clock) {
        net.clock = logic.createClock();
        net.buzz = logic.openBuzz();
      }
      const mp = mpBridge();
      if (!mp) return;
      net.bound = true;
      try {
        mp.onMessage(onNetMessage);
        mp.onPlayersChanged(onRoster);
        if (typeof mp.onResumed === 'function') {
          mp.onResumed((info) => {
            noteBrowserGuest();
            adoptRoom(info);
            if (isGuest() || net.browserGuest) syncSounds(true);
            if (net.browserGuest && !net.role) enterGuest();
            if (!saveReady) return;
            if (isHost()) publish();
            if (isGuest()) sendHost({ t: 'hello' });
            if (!booting) render();
          });
        }
        if (typeof mp.onHostAway === 'function') {
          mp.onHostAway(() => {
            net.hostAway = true;
            if (!booting) render();
          });
        }
      } catch (error) {
        net.detail = errText(error);
      }
    }

    async function resumeRoomBody() {
      const mp = mpBridge();
      if (!mp || typeof mp.resume !== 'function') {
        if (browserGuestShell()) net.resumeError = 'multiplayer.resume fehlt im Browser-Gast.';
        return;
      }
      try {
        const back = await mp.resume();
        if (back && back.role) {
          adoptRoom(back);
          net.resumeError = '';
        } else if (browserGuestShell()) {
          net.resumeError = 'Der Raum hat keinen Beitritt geliefert.';
        }
      } catch (error) {
        const text = errText(error);
        net.detail = text;
        if (browserGuestShell()) net.resumeError = text;
      }
    }

    function resumeRoom() {
      if (resumeFlight) return resumeFlight;
      let flight;
      flight = Promise.resolve().then(resumeRoomBody).then(function () {
        if (resumeFlight === flight) resumeFlight = null;
      }, function () {
        if (resumeFlight === flight) resumeFlight = null;
      });
      resumeFlight = flight;
      return flight;
    }

    function enterGuest() {
      if (!noteBrowserGuest()) return;
      const job = resumeRoom();
      job.then(function () {
        if (isGuest()) sendHost({ t: 'hello' });
        if (!booting) render();
      }, function () {});
    }

    async function openMultiplayer() {
      net.panel = true;
      net.detail = '';
      render();
      const mp = mpBridge();
      if (!mp || typeof mp.discover !== 'function') {
        net.detail = 'Mehrspieler fehlt in dieser OpenScr-Version. Es braucht einen neuen Build. Einzelspiel geht weiter, der QR-Weg ebenfalls erst mit dem Build.';
        render();
        return;
      }
      try {
        await mp.discover({
          onRooms: (rooms) => {
            net.rooms = Array.isArray(rooms) ? rooms : [];
            if (!booting) render();
          }
        });
      } catch (error) {
        net.detail = errText(error);
        render();
      }
    }

    async function closeMultiplayer() {
      net.panel = false;
      const mp = mpBridge();
      if (mp && typeof mp.stopDiscovery === 'function') {
        try { await mp.stopDiscovery(); } catch (error) {}
      }
      render();
    }

    async function offerRoom() {
      const mp = mpBridge();
      if (!mp || typeof mp.host !== 'function') {
        net.detail = 'Mehrspieler fehlt in dieser OpenScr-Version. Es braucht einen neuen Build.';
        render();
        return;
      }
      await withBusy(async () => {
        const room = await mp.host({ maxPlayers: 16, name: 'Song raten', discoverable: true, joinApproval: false, quiet: true });
        adoptRoom({
          role: 'host',
          playerId: room.playerId,
          roomCode: room.roomCode,
          qrPayload: room.qrPayload,
          players: room.players,
          status: 'ready'
        });
        try { if (mp.stopDiscovery) await mp.stopDiscovery(); } catch (error) {}
        publish();
      });
    }

    async function joinFoundRoom(id) {
      const mp = mpBridge();
      if (!mp || !id) return;
      await withBusy(async () => {
        const room = await mp.join({ room: id, name: 'Gast' });
        adoptRoom({
          role: 'guest',
          playerId: room.playerId,
          roomCode: room.roomCode,
          players: room.players,
          status: 'ready'
        });
        net.panel = false;
        sendHost({ t: 'hello' });
      });
    }

    async function joinByQr() {
      const mp = mpBridge();
      if (!mp) return;
      await withBusy(async () => {
        const room = await mp.join({ scan: true, name: 'Gast' });
        adoptRoom({
          role: 'guest',
          playerId: room.playerId,
          roomCode: room.roomCode,
          players: room.players,
          status: 'ready'
        });
        net.panel = false;
        sendHost({ t: 'hello' });
      });
    }

    async function qrImage(text) {
      const mp = mpBridge();
      if (!mp || typeof mp.qrDataUrl !== 'function' || !text) return '';
      return mp.qrDataUrl(text);
    }

    async function hostCodes() {
      const mp = mpBridge();
      if (!mp || typeof mp.codes !== 'function') return null;
      try { return await mp.codes(); } catch (error) { return null; }
    }

    async function paintHostQr() {
      net.qrPanel = 'host';
      net.qrCopied = false;
      if (!isHost()) {
        try { await offerRoom(); } catch (error) {
          net.qrNote = errText(error);
          net.qrImage = '';
          render();
          return;
        }
      }
      let codes = await hostCodes();
      if (codes && !codes.gameUrl) {
        await new Promise((resolve) => setTimeout(resolve, 700));
        codes = await hostCodes();
      }
      const gameUrl = codes && (codes.gameUrl || codes.qrPayload) || '';
      net.qrShare = gameUrl;
      if (net.hostLink === 'hotspot') {
        if (!net.hotSsid) {
          net.qrImage = '';
          net.qrNote = gameUrl ? 'WLAN ist die Vorgabe. Für den Hotspot Name und Passwort eintragen.' : 'Der Spiel-Link wird vorbereitet.';
          render();
          return;
        }
        net.qrImage = await qrImage(wifiPayload(net.hotSsid, net.hotPass));
        net.qrNote = 'Hotspot-Code scannen, danach denselben Spiel-Link öffnen.';
      } else {
        net.qrImage = gameUrl ? await qrImage(gameUrl) : '';
        net.qrNote = gameUrl ? 'Gleiches WLAN. Der Code öffnet das Spiel im Browser.' : 'Der Spiel-Link wird vorbereitet.';
      }
      render();
    }

    async function paintDownloadQr() {
      net.qrPanel = 'download';
      net.qrCopied = false;
      net.qrShare = SCRAP_URL;
      net.qrNote = 'In OpenScr scannen, um Song raten zu laden.';
      net.qrImage = await qrImage(SCRAP_URL);
      render();
    }

    async function copyQrLink() {
      if (!net.qrShare) return;
      const api = bridge();
      try {
        if (api && api.clipboard && api.clipboard.setString) await api.clipboard.setString(net.qrShare);
        else if (navigator.clipboard) await navigator.clipboard.writeText(net.qrShare);
      } catch (error) {
        presentError(error);
      }
      net.qrCopied = true;
      render();
    }

    function shareQrLink() {
      if (!net.qrShare) return;
      if (navigator.share) {
        navigator.share({ title: 'Song raten', text: net.qrShare, url: net.qrShare }).catch(() => {});
        return;
      }
      copyQrLink();
    }

    async function showRoomQr() {
      const mp = mpBridge();
      if (!mp || typeof mp.showQr !== 'function') return;
      try {
        const shown = await mp.showQr();
        if (shown && shown.roomCode) net.roomCode = shown.roomCode;
        if (shown && shown.qrPayload) net.qrPayload = shown.qrPayload;
      } catch (error) {
        presentError(error);
      }
      render();
    }

    async function leaveRoom() {
      const mp = mpBridge();
      try { if (mp && mp.leave) await mp.leave(); } catch (error) { presentError(error); }
      clearNet();
      await restoreLobby();
      render();
    }

    async function claimSearch() {
      if (state.phase !== 'search') return;
      if (isGuest()) {
        sendHost({ t: 'searching' });
        net.searcherId = net.selfId;
        render();
        return;
      }
      net.searcherId = net.selfId;
      publish();
      render();
    }

    function endRoom() {
      const mp = mpBridge();
      const done = mp && mp.endRoom ? mp.endRoom() : Promise.resolve();
      return Promise.resolve(done).then(function () {
        clearNet();
        render();
      }, function (error) {
        presentError(error);
        render();
      });
    }

    function afterStatus() {
      booting = false;
      if (state.spotify.availability && state.spotify.availability.connected) {
        if (connectionProblem(state.error)) state.error = '';
        state.dropNoted = false;
        if (!state.reconnectInFlight) state.resumeAfterReconnect = false;
      } else if (inGame() && state.spotify.availability && state.spotify.availability.connected === false) {
        noteSpotifyDrop();
      }
      if (!isGuest() && state.phase === 'playing' && state.round && !state.round.lock && !state.holdingSfx) startPoll();
      if (net.pendingState) {
        const pending = net.pendingState;
        net.pendingState = null;
        applyGuest(pending);
      }
      render();
    }

    let screenLock = null;
    let bridgeHeld = false;
    let wakeWanted = false;
    let wakeDismissed = false;
    let wakeMode = 'off';

    let resumeFlight = null;

    function watchBridge() {
      let tries = 0;
      const timer = setInterval(() => {
        tries += 1;
        try { bindMultiplayer(); } catch (error) {}
        if (mpBridge() && !net.role && !resumeFlight) {
          resumeRoom().then(function () {
            if (isGuest()) sendHost({ t: 'hello' });
            if (noteBrowserGuest()) enterGuest();
            if (!booting) render();
          }, function () {});
        }
        if (net.role || tries > 16) clearInterval(timer);
      }, 500);
    }

    function waitBridge(maxMs) {
      if (bridge()) return Promise.resolve();
      return new Promise((resolve) => {
        const start = Date.now();
        const timer = setInterval(() => {
          if (bridge() || Date.now() - start >= maxMs) {
            clearInterval(timer);
            resolve();
          }
        }, 50);
      });
    }

    function armGuestWatch() {
      const logic = mpLogic();
      if (!logic || typeof logic.armGuestRetry !== 'function') return;
      logic.armGuestRetry({
        getBridge: bridge,
        document: document,
        hookResume: false,
        tries: 12,
        gap: 200
      }, function (guest) {
        if (!guest) return;
        syncSounds(true);
        enterGuest();
      });
    }

    async function init() {
      console.log('[songraten] init', bridgePlayers() ? 'mit gemeinsamer Namensliste' : 'ohne Namensbrücke');
      bindWakeVideo();
      bind();
      subscribe();
      bindMultiplayer();
      armGuestWatch();
      watchBridge();
      window.addEventListener('pagehide', () => { persistGame(); persistLobby(); persistPlayers(); persistHistory(); });
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') {
          persistGame();
          persistLobby();
          persistPlayers();
          persistHistory();
        } else {
          syncScreenWake(false);
        }
      });
      try {
        if (!noteBrowserGuest() && !spotifyApi()) await waitBridge(800);
        noteBrowserGuest();
        await resumeRoom();
        await loadOrder();
        if (!isGuest() && !browserGuestShell()) {
          await loadPlayers();
          await loadHistory();
          await restoreGame();
          migrateRoster();
        }
        syncSounds(true);
      } catch (error) {}
      saveReady = true;
      flushEarly();
      if (isHost()) publish();
      if (isGuest()) sendHost({ t: 'hello' });
      if (playersDirty) persistPlayers();
      if (lobbyDirty) persistLobby();
      if (spotifyApi()) {
        loadSpotifyStatus().then(afterStatus).catch((error) => { presentError(error); afterStatus(); });
      } else {
        afterStatus();
      }
    }

    init();
  </script>
</body>
</html>
