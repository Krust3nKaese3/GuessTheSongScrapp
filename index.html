<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B0B0F">
  <title>Song raten</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0B0B0F;
      color: #f4f4f5;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    [hidden] { display: none !important; }
    button, input { font: inherit; color: inherit; }
    button { touch-action: manipulation; cursor: pointer; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    #app { max-width: 520px; margin: 0 auto; min-height: 100vh; padding: 20px 18px 32px; }
    header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 22px; }
    h1 { font-size: 34px; line-height: 1.05; margin: 0; font-weight: 760; letter-spacing: -0.03em; }
    h2 { font-size: 22px; line-height: 1.2; margin: 0 0 8px; font-weight: 700; }
    .page-head { display: flex; align-items: center; gap: 10px; }
    .page-head h2 { margin: 0; }
    p { margin: 0; }
    .eyebrow { margin: 0 0 4px; letter-spacing: 0.08em; text-transform: uppercase; font-size: 12px; color: #A3E635; font-weight: 700; }
    .lead, .hint { color: #a1a1aa; line-height: 1.45; }
    .hint { font-size: 15px; }
    .stack { display: flex; flex-direction: column; gap: 14px; }
    .card {
      background: #17171c;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 18px;
      padding: 14px;
    }
    .banner {
      border-radius: 14px;
      padding: 12px 14px;
      line-height: 1.4;
      font-weight: 650;
    }
    .banner.error { background: #ffd8d2; color: #4d100c; }
    .banner.info { background: #d9ffe8; color: #07321c; }
    .banner.warn { background: #ffe08a; color: #332000; }
    .banner .btn { width: 100%; }
    .row { display: flex; gap: 8px; }
    .row > * { flex: 1; }
    textarea, input[type="text"] {
      width: 100%;
      min-height: 52px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: #141418;
      padding: 0 14px;
      font-size: 17px;
    }
    input[type="text"]::placeholder { color: #71717a; }
    .search-field { position: relative; }
    .search-field input { padding-right: 52px; }
    .search-field .icon-btn {
      position: absolute;
      right: 6px;
      top: 50%;
      width: 40px;
      height: 40px;
      flex-basis: 40px;
      transform: translateY(-50%);
      background: transparent;
    }
    .btn {
      min-height: 56px;
      border: 0;
      border-radius: 999px;
      padding: 14px 16px;
      background: #A3E635;
      color: #111;
      font-size: 18px;
      font-weight: 750;
    }
    .btn:active { transform: scale(0.98); }
    .btn.secondary { background: transparent; color: #f4f4f5; border: 2px solid rgba(255, 255, 255, 0.18); }
    .btn.ghost { background: #1c1c22; color: #f4f4f5; min-height: 48px; font-size: 16px; border-radius: 14px; }
    .btn.good { background: #A3E635; color: #111; }
    .btn.bad { background: #3a2024; color: #ffd0c8; }
    .btn:disabled { opacity: 1; background: #2a2a32; color: #71717a; }
    .btn.small { min-height: 44px; padding: 8px 12px; font-size: 15px; }
    .qr-panel { border: 2px solid rgba(255, 255, 255, 0.18); border-radius: 999px; }
    .qr-panel.is-open { border-radius: 28px; padding: 0 14px 14px; display: flex; flex-direction: column; gap: 14px; }
    .qr-panel .qr-btn { border: 0; width: 100%; background: transparent; }
    .qr-btn { display: flex; align-items: center; justify-content: space-between; text-align: left; }
    .qr-btn svg { width: 22px; height: 22px; flex: 0 0 auto; }
    .qr-image { width: min(72vw, 280px); height: auto; align-self: center; background: #fff; border-radius: 16px; padding: 12px; }
    .bug-launcher {
      position: fixed;
      top: calc(10px + env(safe-area-inset-top));
      right: 10px;
      z-index: 40;
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 14px;
      background: #17171c;
      color: #8E8E93;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .bug-launcher svg { width: 22px; height: 22px; display: block; }
    #bug-panel {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(0, 0, 0, 0.55);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 16px;
    }
    #bug-panel[hidden] { display: none; }
    .bug-card { width: min(100%, 520px); background: #17171c; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .bug-card textarea { min-height: 120px; padding: 12px; }
    header { padding-right: 46px; }
    .linkish {
      background: transparent;
      border: 0;
      color: #e4e4e7;
      min-height: 44px;
      font-weight: 650;
      padding: 8px;
      text-align: center;
    }
    .stats-link { font-size: 16px; color: #d4d4d8; }
    .player, .track, .choice {
      width: 100%;
      text-align: left;
      min-height: 60px;
      border-radius: 16px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.05);
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .choice.selected, .track.selected, .choice.searching { border-color: #A3E635; background: rgba(163, 230, 53, 0.12); }
    .choice-row { display: flex; align-items: center; gap: 8px; }
    .choice-row .choice { flex: 1; width: auto; }
    .choice-score { font-weight: 800; color: #A3E635; }
    .track.started { border-color: rgba(255, 224, 138, 0.55); }
    .track .track-go { display: none; width: 40px; height: 40px; flex: 0 0 40px; }
    .track:hover .track-go, .track.selected .track-go, .track:focus-within .track-go { display: inline-flex; }
    .played-tag {
      flex: 0 0 auto;
      background: #ffe08a;
      color: #332000;
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .player-name, .track-title { font-size: 18px; font-weight: 700; }
    .track-meta { display: block; color: #a1a1aa; font-size: 14px; font-weight: 600; margin-top: 2px; }
    .hit { color: #A3E635; font-weight: 750; }
    .icon-btn {
      width: 48px;
      height: 48px;
      flex: 0 0 48px;
      border-radius: 14px;
      border: 0;
      background: rgba(255, 255, 255, 0.1);
      font-size: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .icon-btn svg { width: 22px; height: 22px; display: block; }
    .roster { display: flex; flex-wrap: wrap; gap: 8px; }
    .roster .player {
      width: auto;
      min-height: 40px;
      border-radius: 999px;
      padding: 4px 4px 4px 14px;
      background: #1c1c22;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .roster .player-name { font-size: 15px; font-weight: 650; }
    .roster .icon-btn { width: 32px; height: 32px; flex-basis: 32px; border-radius: 999px; background: transparent; font-size: 14px; color: #d4d4d8; }
    .field-label { font-size: 15px; color: #d4d4d8; margin: 8px 0 0; }
    .suggest:empty { display: none; }
    .suggest {
      background: #17171c;
      border-radius: 16px;
      overflow-x: hidden;
      overflow-y: auto;
      max-height: 260px;
      gap: 0;
      -webkit-overflow-scrolling: touch;
      touch-action: none;
      overscroll-behavior: contain;
    }
    .suggest .choice,
    .suggest .player-name {
      touch-action: none;
    }
    .suggest .choice {
      border: 0;
      border-radius: 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      background: transparent;
      min-height: 52px;
      flex-shrink: 0;
    }
    .suggest .choice:last-child { border-bottom: 0; }
    .suggest .choice.pressed,
    .suggest .choice:active { background: rgba(163, 230, 53, 0.22); }
    .suggest .choice.in-game { box-shadow: none; }
    .suggest-row { display: flex; align-items: stretch; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
    .suggest-row:last-child { border-bottom: 0; }
    .suggest-row.in-game { box-shadow: inset 0 0 0 2px #A3E635; }
    .suggest > :first-child {
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
      overflow: hidden;
    }
    .suggest > :last-child {
      border-bottom-left-radius: 16px;
      border-bottom-right-radius: 16px;
      overflow: hidden;
    }
    .suggest-row .choice { flex: 1; width: auto; border-bottom: 0; }
    .suggest .icon-btn {
      width: 44px;
      height: auto;
      flex: 0 0 44px;
      border-radius: 0;
      background: transparent;
      color: #d4d4d8;
    .suggest .icon-btn.pressed,
    .suggest .icon-btn:active { background: rgba(163, 230, 53, 0.22); color: #A3E635; }
    #addedPlayers:empty { display: none; }
    .suggest .hint { padding: 12px 14px; }
    .stage { min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 18px; text-align: center; padding-top: 8px; }
    .round-head { display: flex; align-items: center; justify-content: center; gap: 14px; }
    .round-label { font-size: 20px; font-weight: 650; color: #f4f4f5; }
    .timer-ring {
      --p: 0;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .timer-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .timer-ring circle { fill: none; stroke: rgba(0, 0, 0, 0.28); stroke-width: 3; }
    .timer-ring .prog {
      stroke: #111;
      stroke-linecap: round;
      stroke-dasharray: calc(var(--p) * 295.3) 295.3;
    }
    .buzzer.lit .timer-ring circle { stroke: rgba(255, 255, 255, 0.28); }
    .buzzer.lit .timer-ring .prog { stroke: #fff; }
    .eq { display: flex; align-items: center; justify-content: center; gap: 3px; height: 36px; width: 58%; position: relative; z-index: 1; }
    .eq span {
      width: 3px;
      height: 8px;
      border-radius: 99px;
      background: currentColor;
      transform-origin: center;
      animation: bounce 1.05s ease-in-out infinite;
    }
    .eq span:nth-child(odd) { animation-duration: 0.85s; }
    .eq span:nth-child(3n) { animation-duration: 1.25s; height: 22px; }
    .eq span:nth-child(4n) { animation-delay: 0.2s; }
    .eq span:nth-child(5n) { animation-delay: 0.35s; }
    .eq.paused span { animation-play-state: paused; }
    @keyframes bounce {
      0%, 100% { transform: scaleY(0.45); }
      50% { transform: scaleY(2.4); }
    }
    .buzzer {
      position: relative;
      width: min(68vw, 280px);
      height: min(68vw, 280px);
      border-radius: 50%;
      border: 0;
      background: #A3E635;
      color: #111;
      font-size: 42px;
      font-weight: 850;
      letter-spacing: 0.02em;
      box-shadow: 0 0 28px rgba(163, 230, 53, 0.55), 0 0 72px rgba(163, 230, 53, 0.28);
      user-select: none;
      touch-action: manipulation;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0;
    }
    .buzzer-label { position: relative; z-index: 1; line-height: 1; }
    .buzzer:active { transform: scale(0.97); }
    .buzzer:disabled { background: #3f4a28; color: #111; box-shadow: none; }
    .buzzer.lit,
    .buzzer.lit:disabled {
      background: #EF4444;
      color: #fff;
      box-shadow: 0 0 28px rgba(239, 68, 68, 0.72), 0 0 72px rgba(239, 68, 68, 0.42);
    }
    .score-card {
      width: min(100%, 360px);
      background: #17171c;
      border-radius: 18px;
      padding: 8px 18px;
    }
    .score-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 0;
      font-size: 17px;
    }
    .reveal-title { font-size: 34px; line-height: 1.15; margin: 0; overflow-wrap: anywhere; }
    .reveal-artist { font-size: 22px; color: #A3E635; margin-top: 6px; overflow-wrap: anywhere; }
    .rank { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.08); font-size: 18px; }
    .rank strong { font-size: 22px; }
    .suggest { display: flex; flex-direction: column; gap: 0; max-height: 260px; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: none; overscroll-behavior: contain; }
    .stat-list { display: flex; flex-direction: column; gap: 10px; }
    .stat-item { padding-bottom: 8px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
    .stat-item:last-child { border-bottom: 0; padding-bottom: 0; }
    details { color: #a1a1aa; }
    summary { min-height: 44px; display: flex; align-items: center; font-weight: 700; color: #f4f4f5; }
    ol { margin: 8px 0 0; padding-left: 18px; }
    li { margin: 6px 0; }
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.62);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 16px;
      padding-bottom: calc(16px + env(safe-area-inset-bottom));
      z-index: 5;
    }
    .modal .card { width: min(520px, 100%); }
    @media (prefers-reduced-motion: reduce) {
      .eq span { animation: none; transform: none; height: 22px; }
    }
    #wakeVideo {
      position: fixed;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
      left: 0;
      bottom: 0;
    }
    .wake-debug {
      position: fixed;
      right: 10px;
      bottom: calc(8px + env(safe-area-inset-bottom));
      z-index: 4;
      margin: 0;
      font-size: 11px;
      line-height: 1.2;
      color: rgba(244, 244, 245, 0.55);
      pointer-events: none;
    }
    .mp-mark { margin: 2px 0 0; font-size: 13px; }
    .player-actions { display: flex; gap: 8px; flex: 0 0 auto; }
    .marks { display: flex; justify-content: center; align-items: center; gap: 16px; }
    .mark {
      width: min(42vw, 200px);
      height: min(42vw, 200px);
      border: 0;
      border-radius: 32px;
      background: #141418;
      color: #f4f4f5;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .mark svg { width: 96px; height: 96px; }
    .mark.good { color: #A3E635; }
    .mark.bad { color: #f43f5e; }
  </style>
</head>

    async function ensureReady() {

    function connectionProblem(text) {

        'In der Spotify-App ist niemand angemeldet.',
        'Spotify hat die Fernsteuerung nicht erlaubt.',
        'Spotify-Anmeldung abgebrochen.',

        'Die Spotify-Anmeldung wurde abgelehnt.'
      ].some((piece) => value.indexOf(piece) !== -1);
    }

    function needsLogin(text) {
      const value = String(text || '');
      return [
        'Spotify ist nicht angemeldet.',
        'In der Spotify-App ist niemand angemeldet.',
        'Spotify hat die Fernsteuerung nicht erlaubt.',
        'Spotify-Anmeldung abgebrochen.',
        'Spotify-Anmeldung fehlgeschlagen.',
        'Die Spotify-Anmeldung wurde abgelehnt.'
      ].some((piece) => value.indexOf(piece) !== -1);
    }

    function noteSpotifyDrop() {
      if (!state.spotify.availability || typeof state.spotify.availability !== 'object') {
        state.spotify.availability = {};
      }
      state.spotify.availability.connected = false;
      if (needsLogin(state.error)) state.spotify.availability.authorized = false;
      if (state.info === 'Wieder mit Spotify verbunden.') state.info = '';
      if (!inGame() || state.dropNoted) return;
      state.dropNoted = true;
      if (state.phase === 'playing' && state.round && !state.round.lock) state.round.holdEnd = true;
      if (state.resumeAfterReconnect) return;
      state.resumeAfterReconnect = Boolean(
        state.phase === 'playing' && state.round && !state.round.lock && !state.transportPaused
      );
    }

    function spotifyDropped() {
      if (!inGame()) return false;
      if (!spotifyApi()) return true;
      const availability = state.spotify.availability;
      if (availability && availability.connected === true) return false;
      if (availability && availability.connected === false) return true;
      return connectionProblem(state.error);
    }

    function armPlaybackGrace(ms) {
      state.playbackGraceUntil = Date.now() + ms;
    }

    function inPlaybackGrace() {
      return Date.now() < (state.playbackGraceUntil || 0);
    }

    function endSuppressed() {
      return state.dropNoted || state.reconnectInFlight || inPlaybackGrace();
    }

    function resumePosition(round) {
      const position = Number(round && round.positionMs) || 0;
      if (position > 0) return position;
      return Math.max(0, Number(round && round.highPos) || 0);
    }

    function notePosition(round, snapshot) {
      const position = Number(snapshot.positionMs) || 0;
      round.positionMs = position;
      if (position > (round.highPos || 0)) round.highPos = position;
    }

    function rememberPlayback(round, playback) {
      if (!round || !playback || !playback.track || !sameTrack(playback.track.uri, round.uri)) return;
      round.seenOwnTrack = true;
      round.unconfirmed = false;
      round.holdEnd = false;
      notePosition(round, playback);
      if (playback.track.durationMs && !round.durationMs) round.durationMs = playback.track.durationMs;
    }

    async function restorePlayback() {
      const round = state.round;
      if (!round) return;
      const api = requireApi();
      armPlaybackGrace(4000);
      let playback = null;
      try {
        playback = normalizeState(await api.resume());
      } catch (error) {
        playback = null;
      }
      const playingOurs = playback && !playback.paused && playback.track && sameTrack(playback.track.uri, round.uri);
      if (!playingOurs) {
        playback = normalizeState(await api.play(round.uri, { positionMs: resumePosition(round) }));
      }
      rememberPlayback(round, playback);
      state.transportPaused = Boolean(!playback || playback.paused);
    }

    async function settlePlayback() {
      const phase = state.phase;
      if (phase === 'playing' && state.round && !state.round.lock) {
        if (state.resumeAfterReconnect) await restorePlayback();
        else if (state.transportPaused) {
          try { await requireApi().pause(); } catch (error) { presentError(error); }
        }
        if (state.phase === 'playing' && state.round && !state.round.lock) startPoll();
        return;
      }
      if (phase === 'guess' || phase === 'reveal' || phase === 'endedAsk' || phase === 'endedWho') {
        try { await requireApi().pause(); } catch (error) { presentError(error); }
      }
    }

    async function reconnectInGame() {
      if (!inGame()) return;
      state.reconnectInFlight = true;
      armPlaybackGrace(20000);
      if (state.phase === 'playing' && state.round) state.round.holdEnd = true;
      try {
        await ensureReady();
        const status = state.spotify.availability;
        if (!status || !status.connected) throw new Error('Verbindung zu Spotify getrennt.');
        state.dropNoted = false;
        armPlaybackGrace(4000);
        await settlePlayback();
        state.info = 'Wieder mit Spotify verbunden.';
        state.resumeAfterReconnect = false;
      } catch (error) {
        if (state.phase === 'playing' && state.round && !state.round.lock) state.transportPaused = true;
        throw error;
      } finally {
        state.reconnectInFlight = false;
      }
    }

    function playerById(id) {
      return state.players.find((player) => player.id === id) || null;
    }

    function currentDjId() {
      if (state.round && state.round.djId) return state.round.djId;
      return state.djId;
    }

    function trackUriOf(value) {
      if (!value) return '';
      if (typeof value === 'string') return value;
      if (typeof value === 'object' && value.uri) return String(value.uri);
      return '';
    }

    function sameId(a, b, kind) {
      const leftUri = trackUriOf(a);
      const rightUri = trackUriOf(b);
      if (!leftUri || !rightUri) return false;
      if (leftUri === rightUri) return true;
      const id = (uri) => {
        const match = String(uri).match(new RegExp('spotify:' + kind + ':([A-Za-z0-9]+)'));
        return match ? match[1] : '';
      };
      const left = id(leftUri);
      const right = id(rightUri);
      return Boolean(left && left === right);
    }

    function sameTrack(a, b) {
      return sameId(a, b, 'track');
    }

    function sameArtist(a, b) {
      return sameId(a, b, 'artist');
    }

    function trackWasStarted(uri) {
      return state.startedUris.some((started) => sameTrack(started, uri));
    }

    function cloneArtists(list) {
      if (!Array.isArray(list)) return [];
      return list.map((artist) => {
        if (!artist) return null;
        if (typeof artist === 'string') return { name: artist, uri: '' };
        const name = artist.name ? String(artist.name) : '';
        const uri = artist.uri ? String(artist.uri) : '';
        if (!name && !uri) return null;
        return { name, uri };
      }).filter(Boolean);
    }

    function rememberStarted(track) {
      const uri = trackUriOf(track);
      if (!uri || trackWasStarted(uri)) return;
      const source = track && typeof track === 'object' ? track : {};
      let artists = cloneArtists(source.artists);
      if (!artists.length && source.artist) {
        artists = String(source.artist).split(',').map((name) => ({ name: name.trim(), uri: '' })).filter((artist) => artist.name);
      }
      state.startedUris.push({
        uri,
        title: source.title || source.name || '',
        artists
      });
    }

    function forgetStarted(uri) {
      state.startedUris = state.startedUris.filter((started) => !sameTrack(started, uri));
    }

    function recommendationWasShown(uri) {
      return state.shownRecommendationUris.some((shown) => sameTrack(shown, uri));
    }

    function recommendationBlocked(uri) {
      return trackWasStarted(uri) || recommendationWasShown(uri);
    }

    function rememberShown(uri) {
      if (!uri || recommendationWasShown(uri)) return;
      state.shownRecommendationUris.push(uri);
    }

    function clearVisibleRecommendations() {
      recsToken += 1;
      state.recommendations = [];
      state.recsReady = false;
      state.recsLoading = false;
      state.recsNote = '';
    }

    function artistLine(item) {
      if (!item) return '';
      if (Array.isArray(item.artists) && item.artists.length) {
        return item.artists.map((artist) => artist && (artist.name || artist)).filter(Boolean).join(', ');
      }
      if (typeof item.artist === 'string') return item.artist;
      return '';
    }

    function normalizeState(raw) {
      let value = raw;
      if (typeof value === 'string') {
        try { value = JSON.parse(value); } catch (e) { return null; }
      }
      if (!value || typeof value !== 'object') return null;
      const track = value.track && typeof value.track === 'object' ? value.track : null;
      return {
        paused: Boolean(value.paused),
        positionMs: Number(value.positionMs) || 0,
        playbackSpeed: Number(value.playbackSpeed),
        track: track ? {
          uri: track.uri || '',
          durationMs: Number(track.durationMs) || 0
        } : null
      };
    }

    function asObject(value) {
      if (typeof value === 'string') {
        try { return JSON.parse(value); } catch (e) { return null; }
      }
      return value;
    }

    function normalizeTracks(found) {
      const payload = asObject(found);
      let items = [];
      if (payload && payload.tracks && Array.isArray(payload.tracks.items)) items = payload.tracks.items;
      else if (payload && Array.isArray(payload.tracks)) items = payload.tracks;
      return items.map((item) => ({
        uri: item.uri,
        title: item.name || 'Unbekannter Titel',
        artist: artistLine(item) || 'Unbekannter Interpret',
        artists: cloneArtists(item.artists),
        album: typeof item.album === 'string' ? item.album : (item.album && item.album.name) || '',
        durationMs: Number(item.durationMs || item.duration_ms) || 0
      })).filter((item) => item.uri && String(item.uri).indexOf('spotify:track:') === 0);
    }

    function normalizeArtistHits(found) {
      const payload = asObject(found);
      let items = [];
      if (payload && payload.artists && Array.isArray(payload.artists.items)) items = payload.artists.items;
      else if (payload && Array.isArray(payload.artists)) items = payload.artists;
      return items.map((item) => ({
        uri: item.uri || '',
        name: item.name || '',
        genres: Array.isArray(item.genres) ? item.genres.map((genre) => {
          if (typeof genre === 'string') return genre.trim();
          return genre && genre.name ? String(genre.name).trim() : '';
        }).filter(Boolean) : []
      })).filter((item) => item.uri || item.name);
    }

    function plainQuery(value) {
      const clean = String(value || '').replace(/\s+/g, ' ').trim();
      if (!clean) return '';
      return clean.length > 200 ? clean.slice(0, 200) : clean;
    }

    function fieldQuery(field, value) {
      const clean = String(value || '').replace(/["\\]/g, ' ').replace(/\s+/g, ' ').trim();
      if (!clean) return '';
      const prefix = field + ':"';
      const room = 200 - prefix.length - 1;
      if (room < 1) return '';
      return prefix + clean.slice(0, room) + '"';
    }

    function seedArtists() {
      const list = [];
      state.startedUris.forEach((seed) => {
        const artists = Array.isArray(seed.artists) ? seed.artists : [];
        artists.forEach((artist) => {
          const name = artist && artist.name ? String(artist.name).trim() : '';
          const uri = artist && artist.uri ? String(artist.uri) : '';
          if (!name && !uri) return;
          const known = list.find((item) => {
            if (uri && item.uri && sameArtist(item, artist)) return true;
            if (!uri && !item.uri && name && item.name.toLowerCase() === name.toLowerCase()) return true;
            return false;
          });
          if (known) {
            if (!known.uri && uri) known.uri = uri;
            if (!known.name && name) known.name = name;
            return;
          }
          list.push({ name, uri });
        });
      });
      return list.filter((artist) => artist.name);
    }

    function matchSeedArtist(hits, artist) {
      if (artist.uri) return hits.find((hit) => hit.uri && sameArtist(hit, artist)) || null;
      if (!artist.name) return null;
      const name = artist.name.toLowerCase();
      return hits.find((hit) => hit.name && hit.name.toLowerCase() === name) || null;
    }

    function trackMatchesArtist(track, artist) {
      const list = Array.isArray(track.artists) ? track.artists : [];
      if (artist.uri && list.some((item) => item.uri && sameArtist(item, artist))) return true;
      const hasUris = Boolean(artist.uri) && list.some((item) => item.uri);
      if (hasUris) return false;
      if (!artist.name) return false;
      const name = artist.name.toLowerCase();
      if (list.some((item) => item.name && item.name.toLowerCase() === name)) return true;
      return String(track.artist || '').split(',').some((part) => part.trim().toLowerCase() === name);
    }

    function uniqueTracks(tracks) {
      const out = [];
      tracks.forEach((track) => {
        if (!track || !track.uri || recommendationBlocked(track.uri)) return;
        if (out.some((item) => sameTrack(item, track))) return;
        out.push(track);
      });
      return out;
    }

    function roundRobin(groups) {
      const out = [];
      const cursors = groups.map(() => 0);
      let moved = true;
      while (moved) {
        moved = false;
        for (let i = 0; i < groups.length; i++) {
          const group = groups[i] || [];
          if (cursors[i] < group.length) {
            out.push(group[cursors[i]]);
            cursors[i] += 1;
            moved = true;
          }
        }
      }
      return out;
    }

    function spreadGenres(lists) {
      const out = [];
      const seen = [];
      let layer = 0;
      while (out.length < 8 && layer < 12) {
        let added = false;
        for (let i = 0; i < lists.length; i++) {
          const genre = lists[i] && lists[i][layer];
          if (!genre) continue;
          const key = genre.toLowerCase();
          if (seen.indexOf(key) !== -1) continue;
          seen.push(key);
          out.push(genre);
          added = true;
          if (out.length >= 8) break;
        }
        if (!added) break;
        layer += 1;
      }
      return out;
    }

    function artistVarietyKey(track) {
      const artists = Array.isArray(track.artists) ? track.artists : [];
      for (let i = 0; i < artists.length; i++) {
        if (artists[i] && artists[i].uri) return artists[i].uri;
      }
      for (let i = 0; i < artists.length; i++) {
        if (artists[i] && artists[i].name) return 'name:' + artists[i].name.toLowerCase();
      }
      if (track.artist) return 'line:' + String(track.artist).toLowerCase();
      return track.uri || '';
    }

    function chooseRecommendationTracks(artistGroups, genreTracks) {
      const mixed = [];
      const artistOrdered = roundRobin(artistGroups);
      const genres = genreTracks || [];
      let ai = 0;
      let gi = 0;
      while (ai < artistOrdered.length || gi < genres.length) {
        if (ai < artistOrdered.length) mixed.push(artistOrdered[ai++]);
        if (gi < genres.length) mixed.push(genres[gi++]);
      }
      const unique = [];
      mixed.forEach((track) => {
        if (!track || !track.uri) return;
        if (unique.some((item) => sameTrack(item, track))) return;
        unique.push(track);
      });
      const keys = unique.map(artistVarietyKey);
      const distinct = [];
      keys.forEach((key) => {
        if (distinct.indexOf(key) === -1) distinct.push(key);
      });
      const picked = [];
      const used = [];
      const deferred = [];
      for (let i = 0; i < unique.length && picked.length < 3; i++) {
        const key = keys[i];
        if (used.indexOf(key) !== -1 && used.length < distinct.length) {
          deferred.push(unique[i]);
          continue;
        }
        picked.push(unique[i]);
        if (used.indexOf(key) === -1) used.push(key);
      }
      deferred.forEach((track) => {
        if (picked.length >= 3) return;
        if (picked.some((item) => sameTrack(item, track))) return;
        picked.push(track);
      });
      return picked.slice(0, 3);
    }

    async function mapPool(items, limit, fn) {
      const results = new Array(items.length);
      let cursor = 0;
      const count = Math.min(limit, items.length);
      const workers = [];
      for (let worker = 0; worker < count; worker++) {
        workers.push((async () => {
          while (cursor < items.length) {
            const index = cursor;
            cursor += 1;
            results[index] = await fn(items[index], index);
          }
        })());
      }
      await Promise.all(workers);
      return results;
    }

    async function buildRecommendations() {
      const artists = seedArtists();
      if (!artists.length) return [];
      let anyOk = false;
      let lastError = null;
      async function searchSafe(query, types, limit) {
        if (!query || query.length > 200) return null;
        try {
          const found = await requireApi().search(query, { types: types, limit: limit });
          anyOk = true;
          return found;
        } catch (error) {
          lastError = error;
          return null;
        }
      }
      const artistResults = await mapPool(artists, 3, async (artist) => {
        const foundTracks = await searchSafe(fieldQuery('artist', artist.name), ['track'], 10);
        const tracks = foundTracks
          ? uniqueTracks(normalizeTracks(foundTracks).filter((track) => trackMatchesArtist(track, artist)))
          : [];
        const foundArtists = await searchSafe(plainQuery(artist.name), ['artist'], 10);
        const match = foundArtists ? matchSeedArtist(normalizeArtistHits(foundArtists), artist) : null;
        const genres = match && match.genres ? match.genres.slice(0, 3) : [];
        return { tracks, genres };
      });
      const genres = spreadGenres(artistResults.map((result) => result.genres || []));
      const genreGroups = await mapPool(genres, 3, async (genre) => {
        const found = await searchSafe(fieldQuery('genre', genre), ['track'], 10);
        return found ? uniqueTracks(normalizeTracks(found)) : [];
      });
      if (!anyOk) {
        if (lastError) throw lastError;
        return [];
      }
      return chooseRecommendationTracks(artistResults.map((result) => result.tracks || []), roundRobin(genreGroups));
    }

    async function loadRecommendations() {
      if (isGuest()) {
        if (state.recsLoading || state.recsReady) return;
        if (!state.songsStarted) {
          state.recommendations = [];
          state.recsNote = 'Empfehlungen erst nach dem ersten Song gehen.';
          render();
          return;
        }
        net.recWait += 1;
        state.recsLoading = true;
        state.recsNote = '';
        state.recommendations = [];
        state.error = '';
        render();
        sendHost({ t: 'recs', id: net.recWait });
        return;
      }
      if (state.recsLoading || state.recsReady) return;
      if (!state.startedUris.length) {
        state.recommendations = [];
        state.recsNote = 'Empfehlungen erst nach dem ersten Song gehen.';
        render();
        return;
      }
      const token = recsToken;
      const djAtStart = state.djId;
      state.recsLoading = true;
      state.recsNote = '';
      state.recommendations = [];
      state.error = '';
      render();
      try {
        await ensureReady();
        const picks = await buildRecommendations();
        if (token !== recsToken || !searchOpen() || state.djId !== djAtStart) return;
        picks.forEach((track) => rememberShown(track.uri));
        state.recommendations = picks;
        state.recsReady = true;
        state.recsNote = picks.length ? '' : 'Keine passenden Empfehlungen.';
      } catch (error) {
        if (token !== recsToken || !searchOpen() || state.djId !== djAtStart) return;
        state.recommendations = [];
        state.recsReady = false;
        presentError(error);
      } finally {
        if (token === recsToken) {
          state.recsLoading = false;
          render();
        }
      }
    }

    function formatMs(ms) {
      const total = Math.round((Number(ms) || 0) / 1000);
      if (!total) return '';
      return Math.floor(total / 60) + ':' + String(total % 60).padStart(2, '0');
    }

    function formatScore(score) {
      if (score > 0) return '+' + score;
      if (score < 0) return '−' + Math.abs(score);
      return '0';
    }

    function endedByPosition(positionMs, durationMs, snapshot) {
      const duration = Number(durationMs) || 0;
      const position = Number(positionMs) || 0;
      if (duration < 1500) return false;
      if (position < Math.min(1200, duration * 0.5)) return false;
      if (position >= duration - 500) return true;
      const stopped = snapshot.paused || snapshot.playbackSpeed === 0;
      return stopped && position >= duration - 2000 && position >= duration * 0.9;
    }

    function stopPoll() {
      if (state.pollTimer) {
        clearInterval(state.pollTimer);
        state.pollTimer = null;
      }
    }

    function startPoll() {
      stopPoll();
      state.pollTimer = setInterval(() => { poll(); }, 1200);
    }

    async function poll() {
      const round = state.round;
      if (!round || round.lock || state.phase !== 'playing' || !spotifyApi()) return;
      try {
        const snapshot = normalizeState(await spotifyApi().getPlayerState());
        if (snapshot) onPlayer(snapshot);
      } catch (error) {
        const text = errText(error);
        if (state.error !== text) presentError(error);
        paintBanners();
      }
      if (round && !round.seenOwnTrack && !round.lock && !round.unconfirmed && Date.now() - round.startedAt > 8000) {
        round.unconfirmed = true;
        if (state.phase === 'playing') render();
      }
    }

    function onPlayer(raw) {
      const snapshot = normalizeState(raw);
      if (!snapshot || state.phase !== 'playing') return;
      if (considerPlayback(snapshot)) return;
      state.transportPaused = snapshot.paused;
      paintTransport();
    }

    function considerPlayback(snapshot) {
      const round = state.round;
      if (!round || round.lock || state.phase !== 'playing' || !snapshot) return false;
      const uri = snapshot.track && snapshot.track.uri;
      const duration = (snapshot.track && snapshot.track.durationMs) || round.durationMs || 0;
      if (duration && !round.durationMs) round.durationMs = duration;
      const ours = Boolean(uri && sameTrack(uri, round.uri));
      // Ignore the first moments. A stale player event can still show the previous track,
      // or the same track sitting at its old ending, before play() settles at position 0.
      if (Date.now() - round.startedAt < 2000) {
        if (ours && snapshot.positionMs < 5000) {
          round.seenOwnTrack = true;
          round.unconfirmed = false;
          notePosition(round, snapshot);
        }
        return false;
      }
      if (ours) {
        round.seenOwnTrack = true;
        round.unconfirmed = false;
        if (round.holdEnd) {
          round.holdEnd = false;
          round.highPos = Number(snapshot.positionMs) || 0;
          round.positionMs = round.highPos;
          return false;
        }
        notePosition(round, snapshot);
        if (endSuppressed()) return false;
        const knownDuration = round.durationMs || duration;
        if (endedByPosition(snapshot.positionMs, knownDuration, snapshot)) {
          resolveNaturalEnd();
          return true;
        }
        if (knownDuration > 15000 && round.highPos > knownDuration * 0.85 && snapshot.positionMs + 5000 < round.highPos) {
          resolveNaturalEnd();
          return true;
        }
        return false;
      }
      if (round.holdEnd || endSuppressed()) return false;
      if (!uri && round.seenOwnTrack && snapshot.paused && round.durationMs && round.highPos >= round.durationMs - 2000) {
        resolveNaturalEnd();
        return true;
      }
      if (round.seenOwnTrack && uri && !sameTrack(uri, round.uri)) {
        resolveNaturalEnd();
        return true;
      }
      return false;
    }

    async function resolveNaturalEnd() {
      const round = state.round;
      if (!round || round.lock || state.phase !== 'playing') return;
      round.lock = true;
      stopPoll();
      state.phase = 'endedAsk';
      state.notice = '';
      net.undo = null;
      if (isHost()) publish();
      render();
      try {
        await requireApi().pause();
      } catch (error) {
        presentError(error);
        paintBanners();
      }
    }

    function paintBanners() {

    function paintTransport() {

      if (resume) resume.hidden = state.holdingSfx || !state.transportPaused;
      const box = document.getElementById('unconfirmed');
      if (box && state.round) box.hidden = !state.round.unconfirmed;
    }

    function buzzHaptic() {
      if (isGuest()) return;
      const api = bridge();
      const vibrate = api && api.vibration && api.vibration.vibrate;
      if (typeof vibrate !== 'function') return;
      try {

      } catch (error) {}

    const FADE_IN_MS = 900;
    const FADE_IN_STEPS = 9;
    let audioCtx = null;
    let buzzerGain = null;
    let buzzerBuffer = null;
    let buzzerSrcSeen = '';
    function sfxVolume() {
      const value = Number(state.sfxGain);
      if (!isFinite(value)) return 0.4;
      return Math.max(0, Math.min(1, value));
    }

    function applySfxVolume() {
      const level = sfxVolume();
      ['sfx-buzzer', 'sfx-correct', 'sfx-wrong'].forEach((id) => {
        const el = document.getElementById(id);

    function loadSfxVolume() {

      } catch (error) {}
      applySfxVolume();
    }

    loadSfxVolume();

    let transportChain = Promise.resolve();
    let transportEpoch = 0;
    let activeSfx = null;

    function beginTransportTurn(keepSfx) {

    function enqueueTransport(task) {
      const job = transportChain.then(task, task);
      transportChain = job.then(function () {}, function () {});
      return job;

    function wait(ms) {
      return new Promise((resolve) => { setTimeout(resolve, ms); });
    }

    function stopSfx() {
      const current = activeSfx;
      activeSfx = null;
      ['sfx-buzzer', 'sfx-correct', 'sfx-wrong'].forEach((id) => {
        const el = document.getElementById(id);
        if (!el) return;
        try { el.pause(); } catch (error) {}

    let soundGate = null;
    const SFX_FILES = {
      buzzer: 'assets/sounds/buzzer.mp3',
      correct: 'assets/sounds/correct.mp3',
      wrong: 'assets/sounds/wrong.mp3'
    };

    function soundGateNow() {
      if (!soundGate) {
        const logic = mpLogic();
        soundGate = logic ? logic.createSoundGate() : { decided: false, guest: false, armed: false };
      }
      return soundGate;
    }

    function soundsBlocked() {
      const logic = mpLogic();
      const gate = soundGateNow();
      if (isGuest() || browserGuestShell()) {
        if (logic && logic.settleSounds(gate, { guest: true }) === 'release') releaseSoundElements();
        return true;
      }
      return logic ? !logic.allowSoundPlay(gate) : false;
    }

    function attachSoundSources() {
      if (soundsBlocked()) return;
      Object.keys(SFX_FILES).forEach((name) => {
        const el = document.getElementById('sfx-' + name);
        if (!el || el.getAttribute('src')) return;
        el.preload = 'auto';
        el.src = SFX_FILES[name];
      });
      watchBuzzerSource();
    }

    function releaseSoundElements() {
      stopSfx();
      Object.keys(SFX_FILES).forEach((name) => {
        const el = document.getElementById('sfx-' + name);
        if (!el) return;
        try { el.pause(); } catch (error) {}
        el.removeAttribute('src');
        el.preload = 'none';
        try { el.load(); } catch (error) {}
        if (el.dataset) el.dataset.warm = '';
      });
      buzzerBuffer = null;
      buzzerSrcSeen = '';
      if (audioCtx) {
        const ctx = audioCtx;
        audioCtx = null;
        buzzerGain = null;
        try { ctx.close(); } catch (error) {}
      }
    }

    function syncSounds(probeDone) {
      const logic = mpLogic();
      if (!logic) return;
      const action = logic.settleSounds(soundGateNow(), {
        guest: isGuest() || browserGuestShell(),
        probeDone: Boolean(probeDone)
      });
      if (action === 'release') releaseSoundElements();
      if (action === 'arm') attachSoundSources();
    }

    function playSfx(name) {
      if (soundsBlocked()) return Promise.resolve();
      stopSfx();
      const el = document.getElementById('sfx-' + name);
      if (!el) return Promise.resolve();
      return new Promise((resolve) => {
        let settled = false;
        let cap = 0;
        const finish = () => {
          if (settled) return;
          settled = true;
          clearTimeout(cap);
          el.removeEventListener('ended', finish);
          el.removeEventListener('error', finish);
          if (activeSfx && activeSfx.cancel === finish) activeSfx = null;
          resolve();
        };
        activeSfx = { cancel: finish };
        el.addEventListener('ended', finish);
        el.addEventListener('error', finish);
        const known = Number(el.duration);
        const capMs = known > 0 && known < 60 ? Math.ceil(known * 1000) + 150 : 1400;
        cap = setTimeout(finish, capMs);
        try { el.currentTime = 0; } catch (error) {}
        el.volume = sfxVolume();
        const played = el.play();
        if (played && typeof played.then === 'function') {
          played.then(function () {}, function () { finish(); });
        }
      });
    }

    function audioContext() {
      if (soundsBlocked()) return null;
      if (audioCtx) return audioCtx;
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      audioCtx = new Ctx();
      buzzerGain = audioCtx.createGain();
      buzzerGain.gain.value = sfxVolume();
      buzzerGain.connect(audioCtx.destination);
      return audioCtx;
    }

    function isTypingTarget(event) {
      const el = event && event.target;
      if (!el || !el.closest) return false;
      return Boolean(el.closest('input, textarea, select, [contenteditable="true"]'));
    }

    function focusedTypingField() {
      const el = document.activeElement;
      if (!el || el === document.body || el === document.documentElement) return null;
      if (el.closest && el.closest('#wakeVideo, audio')) return null;
      const tag = el.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return el;
      if (el.isContentEditable) return el;
      return null;
    }

    function unlockBuzzer() {
      if (soundsBlocked() || focusedTypingField()) return;
      const ctx = audioContext();
      if (ctx && ctx.state === 'suspended') {
        try { ctx.resume(); } catch (error) {}
      }
      const el = document.getElementById('sfx-buzzer');
      if (!el || el.dataset.warm === '1') return;
      el.dataset.warm = '1';
      el.volume = 0;
      const played = el.play();
      const restore = () => {
        try { el.pause(); } catch (error) {}
        try { el.currentTime = 0; } catch (error) {}
        el.volume = sfxVolume();
      };
      if (played && typeof played.then === 'function') {
        played.then(restore, function () {
          el.volume = sfxVolume();
          el.dataset.warm = '';
        });
      } else restore();
    }

    function bytesFromDataUri(src) {
      const comma = src.indexOf(',');
      if (comma < 0 || !/;base64/i.test(src.slice(0, comma))) return null;
      const binary = atob(src.slice(comma + 1));
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return bytes.buffer;
    }

    function decodeBuzzerFrom(src) {
      if (soundsBlocked()) return;
      const ctx = audioContext();
      if (!ctx || !src) return;
      if (src === buzzerSrcSeen) return;
      buzzerSrcSeen = src;
      buzzerBuffer = null;
      const raw = src.indexOf('data:') === 0
        ? Promise.resolve(bytesFromDataUri(src))
        : fetch(src).then((res) => res.arrayBuffer());
      raw.then((buffer) => {
        if (!buffer || src !== buzzerSrcSeen) return null;
        return ctx.decodeAudioData(buffer.slice(0));
      }).then((decoded) => {
        if (decoded && src === buzzerSrcSeen) buzzerBuffer = decoded;
      }).catch(() => {
        if (src === buzzerSrcSeen) buzzerSrcSeen = '';
      });
    }

    function primeBuzzer() {
      if (soundsBlocked()) return;
      const el = document.getElementById('sfx-buzzer');
      if (!el) return;
      decodeBuzzerFrom(el.currentSrc || el.src || '');
    }

    function watchBuzzerSource() {
      const el = document.getElementById('sfx-buzzer');
      if (!el) return;
      primeBuzzer();
      el.addEventListener('loadeddata', primeBuzzer);
      const observer = new MutationObserver(primeBuzzer);
      observer.observe(el, { attributes: true, attributeFilter: ['src'] });
    }

    function playBuzzerImmediate() {
      if (soundsBlocked()) return;
      const ctx = audioContext();
      if (ctx && ctx.state === 'suspended') {
        try { ctx.resume(); } catch (error) {}
      }
      if (ctx && buzzerBuffer && buzzerGain) {
        stopSfx();
        buzzerGain.gain.value = sfxVolume();
        const node = ctx.createBufferSource();
        node.buffer = buzzerBuffer;
        node.connect(buzzerGain);
        try { node.start(0); } catch (error) {
          playSfx('buzzer');
          return;
        }
        node.onended = () => {
          if (activeSfx && activeSfx.node === node) activeSfx = null;
        };
        activeSfx = {
          node: node,
          cancel() {
            try { node.onended = null; node.stop(0); } catch (error) {}
          }
        };
        return;
      }
      playSfx('buzzer');
    }

    function volumeOf(raw) {
      const value = typeof raw === 'number' ? raw : Number(raw && raw.volume);
      if (!(value > 0) || value > 1) return 1;
      return value;
    }

    async function readSpotifyVolume(api) {
      if (typeof api.getVolume !== 'function') return 1;
      try {
        return volumeOf(await api.getVolume());
      } catch (error) {
        return 1;
      }
    }

    async function restoreSpotifyVolume(api, target) {
      if (typeof api.setVolume !== 'function') return;
      try { await api.setVolume(target); } catch (error) {}
    }

    // Pause and resume on the current OpenScr bridge are hard cuts. A fade-in
    // only happens when that bridge also exposes setVolume (0..1).
    async function resumeFadeIn() {
      const api = requireApi();
      const epoch = transportEpoch;
      if (typeof api.setVolume !== 'function') {
        await restorePlayback();
        return;
      }
      const target = await readSpotifyVolume(api);
      if (epoch !== transportEpoch) return;
      let ducked = false;
      try {
        await api.setVolume(0);
        ducked = true;
        if (epoch !== transportEpoch) {
          await restoreSpotifyVolume(api, target);
          return;
        }
        await restorePlayback();
        for (let step = 1; step <= FADE_IN_STEPS; step++) {
          await wait(FADE_IN_MS / FADE_IN_STEPS);
          if (epoch !== transportEpoch) {
            await restoreSpotifyVolume(api, target);
            return;
          }
          await api.setVolume(target * (step / FADE_IN_STEPS));
        }
      } catch (error) {
        if (ducked) await restoreSpotifyVolume(api, target);
        throw error;
      }
    }

    async function withBusy(work) {
      if (state.busy) return;
      state.busy = true;
      state.error = '';
      render();
      try {
        await work();
      } catch (error) {
        presentError(error);
      } finally {
        state.busy = false;
        render();
      }
    }

    function playerApi() {

    }

    function bridgePlayers() {
      const api = globalThis.OpenScrBridge && globalThis.OpenScrBridge.players;
      return api && typeof api.list === 'function' ? api : null;
    }

    function asRiot(player) {
      const name = String((player && (player.name || player.first)) || '').trim();
      const tag = String((player && player.tag) || '').trim();

        tag,

        last: tag,
        created: Number(player && player.created) || 0

    function riotLabel(player) {

    }

    function mpLogic() {
      return globalThis.OpenScrMultiplayer || null;

    function isHost() { return net.role === 'host'; }
    function isGuest() { return net.role === 'guest'; }

    function noteBrowserGuest() {
      const logic = mpLogic();
      if (logic && logic.isBrowserGuest(bridge())) net.browserGuest = true;

    function splitLegacy(name) {
      const clean = String(name || '').trim().replace(/\s+/g, ' ');
      if (!clean) return { first: '', last: '' };
      const space = clean.indexOf(' ');
      if (space === -1) return { first: clean, last: '' };
      return { first: clean.slice(0, space), last: clean.slice(space + 1).trim() };
    }

    function rosterShape(player) {
      const legacy = splitLegacy(player && player.name);
      const first = (player && player.first) || legacy.first;
      const last = player && player.first ? (player.last || '') : ((player && player.last) || legacy.last);
      return { id: player && player.id, first: first, last: last };
    }

    function refreshLabels() {
      const api = playerApi();
      labels = new Map();
      const legacy = [];
      state.players.forEach((player) => {
        const riot = riotLabel(player);
        if (riot) labels.set(player.id, riot);
        else legacy.push(player);

      if (!legacy.length) return;
      if (!api) {
        legacy.forEach((player) => labels.set(player.id, player.name || player.first || ''));

      api.displayNames(legacy.map(rosterShape)).forEach((row) => labels.set(row.id, row.name));

    function rosterPids() {

        if (byPid) return byPid;

      if (!label) return null;

    function migrateRoster() {
      const bridge = bridgePlayers();
      if (bridge) {
        state.players.forEach((player) => {
          const known = player.pid && registry.find((item) => item.id === player.pid);
          if (!known) return;
          player.name = known.name;
          player.tag = known.tag;
          player.first = known.first;
          player.last = known.last;

      const api = playerApi();

        if (!player.last) player.last = legacy.last;

      if (!api) {

        return;

      let changed = false;
      state.players.forEach((player) => {
        const known = player.pid && registry.find((item) => item.id === player.pid);
        if (known) {
          player.first = known.first;
          player.last = known.last;
          player.name = (known.first + ' ' + known.last).trim() || known.first;
          return;
        }
        const match = findSaved(player.first, player.last);
        if (match) {
          player.pid = match.id;
          player.first = match.first;
          player.last = match.last;
          player.name = (match.first + ' ' + match.last).trim() || match.first;
          changed = true;
          return;
        }
        if (!player.first) return;
        let created = player.last ? api.createPlayer(player.first, player.last) : api.createPlayer(player.first, player.first);
        if (created && !player.last) created.last = '';
        if (!created) return;
        rememberPlayer(created);
        player.pid = created.id;
        player.first = created.first;
        player.last = created.last;
        player.name = (created.first + ' ' + created.last).trim() || created.first;
        changed = true;
