    function addSavedPlayer(pid) {
      if (isGuest()) {
        sendHost({ t: 'add', pid: pid });
        state.draftName = '';
        state.creating = false;
        state.error = '';
        render();
        return Promise.resolve();
      }
      const record = directorySource().find((player) => player.id === pid);
      if (!record) return Promise.resolve();
      if (state.players.some((player) => player.pid === record.id)) {
        rejectRequest('Diese Person ist schon dabei.');
        return Promise.resolve();
      }
      const logic = mpLogic();
      const names = playerApi();
      if (net.role && logic && names && logic.duplicateName(state.players, record.first, record.last, names.normalize, null)) {
        rejectRequest('Diesen Namen gibt es schon.');
        return Promise.resolve();
      }
      state.players.push({
        id: state.nextId++,
        pid: record.id,
        first: record.first,
        last: record.last,
        name: record.name || record.first,
        tag: record.tag || '',
        score: 0
      });
      state.draftName = '';
      state.draftFirst = '';
      state.draftLast = '';
      state.creating = false;
      state.error = '';
      lobbyDirty = true;
      const saved = persistLobby();
      if (isHost()) publish();
      if (document.getElementById('openscr-roster')) refreshRoster();
      else if (document.activeElement && document.activeElement.id === 'playerName') {
        paintAddedPlayers();
        paintPlayerSuggest();
      } else render();
      return saved;
    }

    function paintAddedPlayers() {
      const box = document.getElementById('addedPlayers');
      if (box) box.innerHTML = listedPlayers().map((player) => playerRowHtml(player)).join('');
      const start = document.querySelector('#app [data-action="start"]');
      if (start) start.disabled = !!(state.busy || state.players.length < 2);
    }

    function submitPlayerQuery() {
      readNamingFields();
      const api = playerApi();
      const query = (state.draftName || '').trim();
      if (!query || !api) {
        presentError('Tipp eine gespeicherte Person an oder leg eine neue an.');
        render();
        return;
      }
      const hits = api.search(directorySource(), query, rosterPids());
      if (hits.length === 1) {
        addSavedPlayer(hits[0].id);
        return;
      }
      presentError(hits.length
        ? 'Mehrere Treffer. Tipp die richtige Person an.'
        : 'Niemand passt. Leg die Person mit Anzeigename und Tag neu an.');
      render();
    }

    function openCreate() {
      readNamingFields();
      const raw = (state.draftName || '').trim();
      const hash = raw.indexOf('#');
      if (hash >= 0) {
        state.draftFirst = raw.slice(0, hash).trim();
        state.draftLast = raw.slice(hash + 1).trim();
      } else {
        state.draftFirst = raw;
        state.draftLast = '';
      }
      state.creating = true;
      state.error = '';
      render();
    }

    async function createAndAdd(forced) {
      if (!forced) readNamingFields();
      const api = playerApi();
      const first = String(forced ? (forced.name || forced.first) : (state.draftFirst || '')).trim();
      const last = String(forced ? (forced.tag || forced.last) : (state.draftLast || '')).trim();
      const bridge = bridgePlayers();
      if (!api && !bridge) {
        presentError('Die Spielerliste konnte nicht geladen werden.');
        render();
        return;
      }
      if (!first || !last) {
        presentError('Bitte Anzeigename und Tag eintragen.');
        render();
        return;
      }
      if (isGuest()) {
        sendHost({ t: 'create', name: first, tag: last, first: first, last: last });
        state.creating = false;
        state.draftFirst = '';
        state.draftLast = '';
        render();
        return;
      }
      const existing = findSaved(first, last);
      if (existing) {
        state.info = (riotLabel(existing) || (existing.first + ' ' + existing.last)) + ' war schon gespeichert.';
        await addSavedPlayer(existing.id);
        return;
      }
      if (bridge) {
        try {
          const created = asRiot(await bridge.add({ name: first, tag: last }));
          rememberPlayer(created);
          state.info = '';
          await addSavedPlayer(created.id);
        } catch (error) {
          presentError((error && error.message) || 'Der Name konnte nicht gespeichert werden.');
          render();
        }
        return;
      }
      const created = api.createPlayer(first, last);
      if (!created) {
        presentError('Bitte Vor- und Nachname eintragen.');
        render();
        return;
      }
      rememberPlayer(created);
      const saved = persistPlayers();
      state.info = '';
      await addSavedPlayer(created.id);
      await saved;
    }

    function paintPlayerSuggest() {
      const box = document.getElementById('playerSuggestions');
      if (!box) return;
      const api = playerApi();
      box.replaceChildren();
      const field = document.getElementById('playerName');
      if (!field || document.activeElement !== field) return;
      if (!api || state.creating || state.overlay) return;
      if (state.phase !== 'setup' && !(net.role && state.phase === 'dj')) return;
      const hits = api.search(directorySource(), state.draftName, []).slice(0, 30);
      if (!hits.length) {
        if ((state.draftName || '').trim()) {
          const hint = document.createElement('p');
          hint.className = 'hint';
          hint.textContent = 'Kein gespeicherter Treffer.';
          box.appendChild(hint);
        }
        return;
      }
      hits.forEach((player) => {
        const button = document.createElement('button');
        button.type = 'button';
        const seated = alreadySeated(player);
        button.className = seated ? 'choice in-game' : 'choice';
        button.dataset.action = 'add-saved';
        button.dataset.pid = player.id;
        if (seated) button.dataset.inGame = '1';
        button.addEventListener('mousedown', (event) => event.preventDefault());
        const name = document.createElement('span');
        name.className = 'player-name';
        const full = riotLabel(player) || ((player.first + ' ' + player.last).trim() || player.first);
        paintMatch(name, full, state.draftName);
        button.appendChild(name);
        const seat = seatedMatch(player);
        if (!seat) {
          box.appendChild(button);
          return;
        }
        const row = document.createElement('div');
        row.className = 'suggest-row in-game';
        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'icon-btn';
        remove.dataset.action = 'remove-player';
        remove.dataset.id = String(seat.id);
        remove.setAttribute('aria-label', full + ' entfernen');
        remove.textContent = '✕';
        remove.addEventListener('mousedown', (event) => event.preventDefault());
        row.append(button, remove);
        box.appendChild(row);
      });
    }

    function paintMatch(node, full, query) {
      const q = String(query || '').trim();
      const lower = full.toLocaleLowerCase('de');
      const needle = q.toLocaleLowerCase('de');
      const at = needle ? lower.indexOf(needle) : -1;
      if (at < 0) {
        node.textContent = full;
        return;
      }
      node.appendChild(document.createTextNode(full.slice(0, at)));
      const mark = document.createElement('span');
      mark.className = 'hit';
      mark.textContent = full.slice(at, at + needle.length);
      node.appendChild(mark);
      node.appendChild(document.createTextNode(full.slice(at + needle.length)));
    }

    function beginSession() {
      const api = statsApi();
      if (!api) {
        state.session = null;
        return;
      }
      state.session = api.createGame(state.players.map((player) => player.pid).filter(Boolean), Date.now());
      state.session.full = true;
    }

    function activeSession() {
      if (state.session && Array.isArray(state.session.events)) return state.session;
      const api = statsApi();
      if (!api) return null;
      state.session = api.createGame(state.players.map((player) => player.pid).filter(Boolean), Date.now());
      state.session.full = false;
      return state.session;
    }

    function logEvent(event) {
      if (!event || (!event.p && !event.dj)) return;
      const session = activeSession();
      if (!session) return;
      session.events.push(event);
    }

    function buzzSeconds(round) {
      const pos = Number(round && round.positionMs);
      if (isFinite(pos) && pos > 250) return pos / 1000;
      const started = Number(round && round.startedAt);
      if (isFinite(started) && started > 0) return Math.max(0, (Date.now() - started) / 1000);
      if (isFinite(pos) && pos >= 0) return pos / 1000;
      return null;
    }

    function dropTrailingRound(uri) {
      const session = state.session;
      const api = statsApi();
      if (!session || !api || !Array.isArray(session.events)) return;
      const id = api.roundEvent('', uri, '', '').id;
      for (let i = session.events.length - 1; i >= 0; i -= 1) {
        const event = session.events[i];
        if (event.t === 'v' || event.t === 'k' || event.t === 'd') return;
        if (event.t === 'r' && event.id === id) {
          session.events.splice(i, 1);
          return;
        }
      }
    }

    async function archiveFinishedGame() {
      const api = statsApi();
      const session = state.session;
      state.session = null;
      if (!api || !session || !session.full) return;
      if (!session.events.some((event) => event && event.t === 'r')) return;
      session.players = state.players.map((player) => player.pid).filter(Boolean);
      historyDoc = api.ingest(historyDoc || api.emptyHistory(), api.finishGame(session, Date.now()));
      historyDirty = true;
      await persistHistory();
    }

    async function removePlayer(id) {
      if (isGuest()) {
        sendHost({ t: 'remove', id: id });
        return;
      }
      const logic = mpLogic();
      if (net.role && logic) {
        const block = logic.removalBlock(id, currentDjId(), state.guesserId);
        if (block) {
          rejectRequest(block);
          return;
        }
      }
      state.players = state.players.filter((player) => player.id !== id);
      lobbyDirty = true;
      const saved = persistLobby();
      if (isHost()) publish();
      if (document.getElementById('openscr-roster')) refreshRoster();
      else if (document.activeElement && document.activeElement.id === 'playerName') {
        paintAddedPlayers();
        paintPlayerSuggest();
      } else render();
      await saved;
    }

    async function renamePlayer(id, first, last) {
      const given = String(first || '').trim();
      const family = String(last || '').trim();
      if (isGuest()) {
        sendHost({ t: 'rename', id: id, name: given, tag: family, first: given, last: family });
        net.renamingId = 0;
        render();
        return;
      }
      if (!given || !family) {
        rejectRequest('Bitte Anzeigename und Tag eintragen.');
        return;
      }
      const logic = mpLogic();
      const names = playerApi();
      const player = playerById(id);
      if (!player) return;
      if (logic && names && logic.duplicateName(state.players, given, family, names.normalize, player.id)) {
        rejectRequest('Diesen Namen gibt es schon.');
        return;
      }
      player.first = given;
      player.last = family;
      player.name = given;
      player.tag = family;
      if (player.pid) {
        const bridge = bridgePlayers();
        if (bridge) {
          try {
            const updated = asRiot(await bridge.update({ id: player.pid, name: given, tag: family }));
            const saved = registry.find((item) => item.id === player.pid);
            if (saved) Object.assign(saved, updated);
          } catch (error) {
            rejectRequest((error && error.message) || 'Der Name konnte nicht geändert werden.');
            return;
          }
        } else {
          const saved = registry.find((item) => item.id === player.pid);
          if (saved) {
            saved.first = given;
            saved.last = family;
            saved.name = given;
            saved.tag = family;
            playersDirty = true;
            persistPlayers();
          }
        }
      }
      net.renamingId = 0;
      lobbyDirty = true;
      persistLobby();
      if (isHost()) publish();
      render();
    }

    async function startGame() {
      if (isGuest()) {
        sendHost({ t: 'start' });
        return;
      }
      if (browserGuestShell()) {
        presentError('Dieses Gerät wartet auf den Raum. Den QR-Code zeigt OpenScr auf dem Host.');
        render();
        return;
      }
      if (state.players.length < 2) {
        rejectRequest('Mindestens zwei Personen. Sonst kann außer dem DJ niemand raten.');
        return;
      }
      lobbyDirty = true;
      await persistLobby();
      await withBusy(async () => {
        await ensureReady();
        state.dropNoted = false;
        state.resumeAfterReconnect = false;
        state.playbackGraceUntil = 0;
        state.overlay = null;
        state.creating = false;
        beginSession();
        state.phase = 'dj';
        state.djId = null;
        state.round = null;
        state.info = net.role
          ? 'Jede Runde wählt ein Handy den DJ. Suchen und Los gehen auf jedem Handy, Spotify spielt nur hier.'
          : '';
        net.buzzDevice = '';
        net.searcherId = '';
        net.undo = null;
        resetBuzzTable();
        if (isHost()) publish();
      });
    }

    function selectDj(id) {
      if (!playerById(id)) return;
      state.djId = id;
      confirmDj();
    }

    function backNameActs() {
      if (net.localSearch) return true;
      if (net.role && (state.phase === 'search' || state.phase === 'mark') && isGuest()) return true;
      if (state.phase === 'mark' || state.phase === 'search' || state.phase === 'endedWho') return true;
      if (state.phase === 'guess') return Boolean(state.guesserId);
      return false;
    }

    function backNameButtonHtml() {
      if (!backNameActs()) return '';
      const icon = '<svg viewBox="0 0 512 512" aria-hidden="true" focusable="false"><path d="M244 400 100 256l144-144M120 256h292" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="48"/></svg>';
      return `<button type="button" class="icon-btn" data-action="back-name" aria-label="Zurück">${icon}</button>`;
    }

    function pageTitle(text) {
      return `<div class="page-head">${backNameButtonHtml()}<h2>${text}</h2></div>`;
    }

    function backName() {
      if (net.localSearch) {
        leaveLocalSearch();
        return;
      }
      if (!backNameActs()) return;
      if (net.role && state.phase === 'search' && isGuest()) {
        sendHost({ t: 'back' });
        return;
      }
      if (net.role && state.phase === 'mark' && isGuest()) {
        state.phase = 'guess';
        state.guesserId = null;
        net.confirmJudge = '';
        net.pickedLocal = false;
        sendHost({ t: 'back' });
        render();
        return;
      }
      if (state.phase === 'mark') {
        state.phase = 'guess';
        state.guesserId = null;
        net.confirmJudge = '';
        net.pickedLocal = false;
        if (isHost()) publish();
        render();
        return;
      }
      if (state.phase === 'search') {
        clearVisibleRecommendations();
        state.phase = 'dj';
        state.djId = null;
        state.picked = null;
        state.results = [];
        state.draftQuery = '';
        state.error = '';
        state.info = '';
        net.searcherId = '';
        if (isHost()) publish();
        render();
        return;
      }
      if (state.phase === 'dj') {
        if (!state.djId && !net.djSent) return;
        state.djId = null;
        state.error = '';
        if (isGuest() && net.djSent) {
          net.djSent = false;
          sendHost({ t: 'back' });
        }
        render();
        return;
      }
      if (state.phase === 'guess') {
        if (!state.guesserId) return;
        state.guesserId = null;
        net.pickedLocal = false;
        if (isGuest()) sendHost({ t: 'back' });
        render();
        return;
      }
      if (state.phase === 'endedWho') {
        if (state.guesserId) {
          state.guesserId = null;
          net.pickedLocal = false;
          render();
          return;
        }
        if (isGuest()) {
          sendHost({ t: 'back-ended' });
          return;
        }
        state.phase = 'endedAsk';
        state.guesserId = null;
        if (isHost()) publish();
        render();
      }
    }

    function searchOpen() {
      return state.phase === 'search' || net.localSearch || net.acceptingLos;
    }

    function noteSearcher(device, djId) {
      const id = Number(djId);
      if (!device || !id) return;
      net.searchers = (net.searchers || []).filter((row) => String(row.device) !== String(device));
      net.searchers.push({ device: String(device), djId: id });
    }

    function dropSearcher(device) {
      net.searchers = (net.searchers || []).filter((row) => String(row.device) !== String(device));
    }

    function leaveLocalSearch() {
      net.localSearch = false;
      net.djSent = false;
      state.picked = null;
      state.results = [];
      state.draftQuery = '';
      state.error = '';
      state.info = '';
      clearVisibleRecommendations();
      if (isGuest()) {
        sendHost({ t: 'back' });
        render();
        return;
      }
      dropSearcher(net.selfId);
      if (isHost()) publish();
      render();
    }

    function confirmDj() {
      if (!playerById(state.djId)) {
        presentError('Bitte zuerst auswählen, wer DJ ist.');
        render();
        return;
      }
      state.picked = null;
      state.results = [];
      state.draftQuery = '';
      clearVisibleRecommendations();
      state.error = '';
      state.info = '';
      net.undo = null;
      if (!net.role) {
        state.phase = 'search';
        net.searcherId = '';
        render();
        return;
      }
      net.localSearch = true;
      if (isGuest()) {
        net.djSent = true;
        sendHost({ t: 'dj', id: state.djId });
        render();
        return;
      }
      noteSearcher(net.selfId, state.djId);
      if (isHost()) publish();
      render();
    }

    async function runSearch() {
      const query = (state.draftQuery || '').trim();
      if (!query) {
        presentError('Suchbegriff fehlt.');
        render();
        return;
      }
      if (isGuest()) {
        net.searchWait += 1;
        const id = net.searchWait;
        state.busy = true;
        state.error = '';
        render();
        sendHost({ t: 'search', id: id, q: query });
        return;
      }
      if (isHost() && net.searcherId !== net.selfId) {
        net.searcherId = net.selfId;
        publish();
      }
      await withBusy(async () => {
        if (!searchOpen()) return;
        await ensureReady();
        if (!searchOpen()) return;
        const found = await requireApi().search(query, { types: ['track'], limit: 8 });
        if (!searchOpen()) return;
        state.results = normalizeTracks(found);
        const stillVisible = state.picked && (
          state.results.some((track) => sameTrack(track, state.picked))
          || state.recommendations.some((track) => sameTrack(track, state.picked))
        );
        state.picked = stillVisible ? state.picked : null;
        state.info = state.results.length ? 'Tipp einen Song an und dann auf Los.' : 'Nichts gefunden. Versuch einen anderen Suchbegriff.';
      });
    }

    function pickTrack(uri) {
      state.picked = state.results.find((track) => sameTrack(track, uri))
        || state.recommendations.find((track) => sameTrack(track, uri))
        || null;
      if (state.error === ALREADY_STARTED) state.error = '';
      render();
    }

    async function los() {
      if (isGuest()) {
        if (!net.localSearch || !state.picked) return;
        state.busy = true;
        render();
        sendHost({ t: 'los', track: slimTrack(state.picked) });
        return;
      }
      if (!searchOpen() || !state.picked || !playerById(state.djId)) return;
      if (state.spotify.availability && state.spotify.availability.premium === false) {
        presentError(NOT_PREMIUM);
        render();
        return;
      }
      if (trackWasStarted(state.picked.uri)) {
        state.error = ALREADY_STARTED;
        render();
        return;
      }
      const picked = state.picked;
      await withBusy(async () => {
        if (!searchOpen()) return;
        await ensureReady();
        if (!searchOpen()) return;
        const api = requireApi();
        let playback = normalizeState(await api.play(picked.uri, { positionMs: 0 }));
        if (!searchOpen()) {
          try { await api.pause(); } catch (error) { presentError(error); }
          return;
        }
        if (playback && playback.track && sameTrack(playback.track.uri, picked.uri) && playback.positionMs > 1500) {
          try {
            playback = normalizeState(await api.seek(0));
          } catch (error) {
            presentError(error);
          }
        }
        if (!searchOpen()) {
          try { await api.pause(); } catch (error) { presentError(error); }
          return;
        }
        state.round = {
          djId: state.djId,
          uri: picked.uri,
          secretTitle: picked.title,
          secretArtist: picked.artist,
          durationMs: (playback && playback.track && playback.track.durationMs) || picked.durationMs || 0,
          seenOwnTrack: Boolean(playback && playback.track && sameTrack(playback.track.uri, picked.uri)),
          highPos: 0,
          positionMs: playback ? (Number(playback.positionMs) || 0) : 0,
          lock: false,
          startedAt: Date.now(),
          unconfirmed: false,
          outcome: '',
          outcomeWho: ''
        };
        state.songsStarted += 1;
        rememberStarted(picked);
        const djPlayer = playerById(state.djId);
        const stats = statsApi();
        if (stats && djPlayer && djPlayer.pid) logEvent(stats.roundEvent(djPlayer.pid, picked.uri, picked.title, picked.artist));
        state.transportPaused = Boolean(playback && playback.paused);
        state.resumeAfterReconnect = false;
        state.notice = '';
        state.info = '';
        state.results = [];
        state.phase = 'playing';
        net.localSearch = false;
        net.acceptingLos = false;
        net.searchers = [];
        net.searcherId = '';
        net.buzzDevice = '';
        net.pressedBuzz = false;
        net.localLock = false;
        net.hostPaused = false;
        net.undo = null;
        resetBuzzTable();
        startPoll();
        if (isHost()) publish();
      });
    }

    function buzz(fromKey) {
      noteAction('Buzzer');
      if (net.role) {
        netBuzz(fromKey);
        return;
      }
      const round = state.round;
      if (!round || state.phase !== 'playing' || round.lock || state.holdingSfx) return;
      let pauseCall;
      try {
        pauseCall = requireApi().pause();
      } catch (error) {
        pauseCall = Promise.reject(error);
      }
      playBuzzerImmediate();
      net.pressedBuzz = true;
      applyBuzzFace();
      net.pressedBuzz = false;
      round.lock = true;
      round.pendingSec = buzzSeconds(round);
      stopPoll();
      state.resumeAfterReconnect = false;
      beginTransportTurn(true);
      state.phase = 'guess';
      state.guesserId = null;
      state.notice = '';
      buzzHaptic();
      settleBuzzScreen();
      pauseCall.then(() => {}, (error) => {
        presentError(error);
        paintBanners();
      });
    }

    async function resumeTransport() {
      if (state.phase !== 'playing' || !state.round || state.round.lock || state.holdingSfx) return;
      try {
        state.resumeAfterReconnect = false;
        await restorePlayback();
        state.error = '';
        paintTransport();
        paintBanners();
      } catch (error) {
        state.transportPaused = true;
        state.resumeAfterReconnect = true;
        presentError(error);
        paintTransport();
        paintBanners();
      }
    }

    async function retryPlay() {
      const round = state.round;
      if (!round || round.seenOwnTrack || state.phase !== 'playing') return;
      await withBusy(async () => {
        const api = requireApi();
        let playback = normalizeState(await api.play(round.uri, { positionMs: 0 }));
        if (playback && playback.track && sameTrack(playback.track.uri, round.uri) && playback.positionMs > 1500) {
          playback = normalizeState(await api.seek(0));
        }
        round.seenOwnTrack = Boolean(playback && playback.track && sameTrack(playback.track.uri, round.uri));
        round.unconfirmed = false;
        round.startedAt = Date.now();
        round.highPos = 0;
        state.transportPaused = Boolean(playback && playback.paused);
        if (state.phase === 'playing') startPoll();
      });
    }

    async function backToSearch() {
      const round = state.round;
      if (!round || round.seenOwnTrack || state.phase !== 'playing') return;
      round.lock = true;
      stopPoll();
      try { await requireApi().pause(); } catch (error) { presentError(error); }
      state.songsStarted = Math.max(0, state.songsStarted - 1);
      forgetStarted(round.uri);
      dropTrailingRound(round.uri);
      state.round = null;
      state.phase = 'search';
      state.info = 'Der Song ist nicht angelaufen. Such noch einmal.';
      net.localLock = false;
      net.pressedBuzz = false;
      resetBuzzTable();
      if (isHost()) publish();
      render();
    }

    function selectGuesser(id) {
      const player = playerById(id);
      const dj = currentDjId();
      if (!player || player.id === dj) return;
      if (net.role && state.phase === 'guess') {
        if (String(net.buzzDevice) !== String(net.selfId)) return;
        net.pickedLocal = true;
        net.confirmJudge = '';
        if (isGuest()) {
          state.guesserId = player.id;
          net.pickedLocal = true;
          sendHost({ t: 'pick', id: player.id });
          render();
          return;
        }
        applyPick(player.id);
        return;
      }
      state.guesserId = player.id;
      state.phase = 'mark';
      render();
    }

    async function judge(correct) {
      const round = state.round;
      const guesser = playerById(state.guesserId);
      if (isGuest()) {
        const want = correct ? 'yes' : 'no';
        if (net.confirmJudge !== want) {
          net.confirmJudge = want;
          render();
          return;
        }
        net.confirmJudge = '';
        sendHost({ t: 'judge', correct: Boolean(correct), id: state.guesserId });
        return;
      }
      if (!round || !guesser || (state.phase !== 'guess' && state.phase !== 'mark') || guesser.id === round.djId) return;
      if (isHost()) net.undo = captureUndo();
      if (correct) {
        guesser.score += 2;
        round.outcome = 'correct';
        round.outcomeWho = labelOf(guesser);
        const stats = statsApi();
        if (stats && guesser.pid) {
          logEvent(stats.buzzEvent(guesser.pid, round.pendingSec));
          logEvent(stats.scoreEvent(guesser.pid, true, 2, round.pendingSec));
        }
        round.pendingSec = null;
        state.phase = 'reveal';
        net.pressedBuzz = false;
        const epoch = beginTransportTurn();
        if (isHost()) {
          noteLocalScore(guesser);
          publish({ scoredPid: guesser.pid || '' });
        }
        render();
        enqueueTransport(async () => {
          if (epoch !== transportEpoch) return;
          if (!isGuest()) await playSfx('correct');
          if (epoch !== transportEpoch || state.phase !== 'reveal' || state.round !== round) return;
          try {
            await resumeFadeIn();
          } catch (error) {
            presentError(error);
            paintBanners();
          }
        });
        return;
      }
      guesser.score -= 1;
      round.lock = false;
      const wrongStats = statsApi();
      if (wrongStats && guesser.pid) {
        logEvent(wrongStats.buzzEvent(guesser.pid, round.pendingSec));
        logEvent(wrongStats.scoreEvent(guesser.pid, false, -1));
      }
      round.pendingSec = null;
      state.notice = labelOf(guesser) + ' liegt falsch und bekommt −1. Nach dem Ton läuft der Song sofort weiter.';
      state.phase = 'playing';
      state.transportPaused = true;
      const epoch = beginTransportTurn();
      state.holdingSfx = true;
      if (isHost()) {
        noteLocalScore(guesser);
        publish({ scoredPid: guesser.pid || '' });
      }
      render();
      enqueueTransport(async () => {
        try {
          if (epoch !== transportEpoch) return;
          if (!isGuest()) await playSfx('wrong');
          if (epoch !== transportEpoch || state.phase !== 'playing' || state.round !== round) return;
          startPoll();
          try {
            await restorePlayback();
            paintTransport();
          } catch (error) {
            state.transportPaused = true;
            state.resumeAfterReconnect = true;
            presentError(error);
            paintTransport();
            paintBanners();
          }
        } finally {
          if (epoch === transportEpoch) {
            state.holdingSfx = false;
            net.localLock = false;
            net.buzzDevice = '';
            net.pressedBuzz = false;
            resetBuzzTable();
            if (isHost()) publish();
            render();
          }
        }
      });
    }

    async function resumeMistake() {
      if (isGuest()) {
        sendHost({ t: 'mistake' });
        return;
      }
      const round = state.round;
      if (!round || (state.phase !== 'guess' && state.phase !== 'mark')) return;
      const epoch = beginTransportTurn();
      round.lock = false;
      round.pendingSec = null;
      state.notice = 'Stopp zurückgenommen. Der Song läuft weiter, niemand bekommt Punkte.';
      state.phase = 'playing';
      net.buzzDevice = '';
      net.localLock = false;
      net.pressedBuzz = false;
      net.pickedLocal = false;
      net.confirmJudge = '';
      net.undo = null;
      resetBuzzTable();
      if (isHost()) publish();
      render();
      startPoll();
      enqueueTransport(async () => {
        if (epoch !== transportEpoch) return;
        try {
          await restorePlayback();
          paintTransport();
        } catch (error) {
          state.transportPaused = true;
          state.resumeAfterReconnect = true;
          presentError(error);
          paintTransport();
          paintBanners();
        }
      });
    }

    async function skipSong() {
      if (isGuest()) {
        sendHost({ t: 'skip' });
        return;
      }
      const round = state.round;
      const dj = round && playerById(round.djId);
      if (!round || !dj || state.phase !== 'playing' || round.lock || state.holdingSfx || net.localLock) return;
      round.lock = true;
      stopPoll();
      dj.score -= 3;
      round.outcome = 'skip';
      const skipStats = statsApi();
      if (skipStats && dj.pid) logEvent(skipStats.skipEvent(dj.pid, -3));
      state.phase = 'reveal';
      net.undo = null;
      if (isHost()) publish();
      render();
      try { await requireApi().pause(); } catch (error) { presentError(error); paintBanners(); }
    }

    function endedYes() {
      if (isGuest()) {
        sendHost({ t: 'ended-yes' });
        return;
      }
      if (state.phase !== 'endedAsk') return;
      state.guesserId = null;
      state.phase = 'endedWho';
      if (isHost()) publish();
      render();
    }

    function endedNo() {
      if (isGuest()) {
        sendHost({ t: 'ended-no' });
        return;
      }
      const round = state.round;
      const dj = round && playerById(round.djId);
      if (!round || !dj || state.phase !== 'endedAsk') return;
      dj.score -= 3;
      round.outcome = 'ended-no';
      const missStats = statsApi();
      if (missStats && dj.pid) logEvent(missStats.missEvent(dj.pid, -3));
      state.phase = 'reveal';
      net.undo = null;
      if (isHost()) publish();
      render();
    }

    function confirmEndedWho() {
      if (isGuest()) {
        if (!state.guesserId) return;
        net.pickedLocal = true;
        sendHost({ t: 'ended-who', id: state.guesserId });
        return;
      }
      const round = state.round;
      const guesser = playerById(state.guesserId);
      if (!round || !guesser || state.phase !== 'endedWho' || guesser.id === round.djId) return;
      guesser.score += 2;
      round.outcome = 'ended-yes';
      round.outcomeWho = labelOf(guesser);
      const endStats = statsApi();
      if (endStats && guesser.pid) logEvent(endStats.scoreEvent(guesser.pid, true, 2, round.durationMs ? round.durationMs / 1000 : null));
      state.phase = 'reveal';
      if (isHost()) {
        noteLocalScore(guesser);
        publish({ scoredPid: guesser.pid || '' });
      }
      render();
    }

    function nextDj() {
      if (isGuest()) {
        sendHost({ t: 'next' });
        return;
      }
      beginTransportTurn();
      stopPoll();
      clearVisibleRecommendations();
      state.phase = 'dj';
      net.localSearch = false;
      net.searchers = [];
      state.djId = null;
      state.picked = null;
      state.results = [];
      state.round = null;
      state.guesserId = null;
      state.notice = '';
      state.error = '';
      state.info = net.role
        ? 'Nächste Runde. Auf irgendeinem Handy den DJ wählen.'
        : 'Gib das Handy weiter. Die nächste Person bestätigt, dass sie DJ ist.';
      net.buzzDevice = '';
      net.searcherId = '';
      net.undo = null;
      net.localLock = false;
      if (isHost()) publish();
      render();
    }

    function askEnd() { state.confirmEnd = true; render(); }
    function cancelEnd() { state.confirmEnd = false; render(); }

    async function finishGame() {
      if (isGuest()) {
        sendHost({ t: 'end' });
        return;
      }
      wakeDismissed = true;
      releaseAwake();
      beginTransportTurn();
      state.confirmEnd = false;
      stopPoll();
      clearVisibleRecommendations();
      if (state.round) state.round.lock = true;
      try { await archiveFinishedGame(); } catch (error) {}
      state.phase = 'final';
      state.resumeAfterReconnect = false;
      state.dropNoted = false;
      lobbyDirty = true;
      const lobbySaved = persistLobby();
      const gameSaved = persistGame();
      await lobbySaved;
      await gameSaved;
      await enqueueTransport(async () => {
        const api = spotifyApi();
        if (!api) return;
        try { await api.stop(); } catch (error) { presentError(error); }
      });
      if (isHost()) publish();
      render();
    }

    async function returnToLobby() {
      if (isGuest()) {
        sendHost({ t: 'home' });
        return;
      }
      wakeDismissed = true;
      releaseAwake();
      beginTransportTurn();
      state.players.forEach((player) => { player.score = 0; });
      state.session = null;
      state.overlay = null;
      state.phase = 'setup';
      state.djId = null;
      state.round = null;
      state.picked = null;
      state.results = [];
      state.draftQuery = '';
      state.guesserId = null;
      state.songsStarted = 0;
      state.startedUris = [];
      state.shownRecommendationUris = [];
      clearVisibleRecommendations();
      state.notice = '';
      state.info = '';
      state.error = '';
      state.confirmEnd = false;
      state.resumeAfterReconnect = false;
      state.dropNoted = false;
      state.playbackGraceUntil = 0;
      state.transportPaused = false;
      lobbyDirty = true;
      const lobbySaved = persistLobby();
      net.buzzDevice = '';
      net.searcherId = '';
      net.undo = null;
      net.localLock = false;
      if (isHost()) publish();
      render();
      await lobbySaved;
      await persistGame();
    }

    function listedPlayers() {
      if (!net.role) return state.players;
      const logic = mpLogic();
      if (!logic) return state.players;
      const keyOf = (player) => (player.pid ? String(player.pid) : ('id:' + player.id));
      const keys = state.players.map(keyOf);
      const arranged = logic.arrange(keys, net.locked, net.seen.length ? net.seen : keys);
      net.seen = arranged.map((id) => String(id));
      const map = new Map(state.players.map((player) => [keyOf(player), player]));
      return arranged.map((id) => map.get(String(id))).filter(Boolean);
    }

    function noteLocalScore(player) {
      if (!net.pickedLocal || !player || !player.pid) return;
      const logic = mpLogic();
      if (!logic) return;
      net.locked = logic.lockIn(net.locked, player.pid);
      net.pickedLocal = false;
      saveOrder();
    }

        : '<p class="hint">Keine offenen Spiele in der Nähe. Der QR-Code zum Mitspielen kommt von OpenScr auf dem Host, auch für den Browser.</p>';

      return `<form class="stack" data-action="create-player">
        <input id="playerFirst" type="text" maxlength="16" placeholder="Anzeigename" autocomplete="off" autocapitalize="words" value="${esc(state.draftFirst)}" aria-label="Anzeigename">
        <input id="playerLast" type="text" maxlength="5" placeholder="Tag" autocomplete="off" autocapitalize="characters" value="${esc(state.draftLast)}" aria-label="Tag">
        <button class="btn" type="submit">Speichern und hinzufügen</button>
        <button type="button" class="btn ghost" data-action="cancel-create">Zurück</button>
      </form>`;
    }

    function renderGuestBoot() {
      if (net.resumeError) {
        return `${headerHtml()}<div class="stack">
          <section class="card stack">
            <h2>Raum nicht erreichbar</h2>
            <p class="lead">Der Beitritt als Gast ist fehlgeschlagen.</p>
            <textarea id="guestError" readonly rows="6">${esc(net.resumeError)}</textarea>
            <button type="button" class="btn" data-action="copy-guest-error">Fehler kopieren</button>
          </section>
        </div>`;
      }
      if (!isGuest()) {
        return `${headerHtml()}<div class="stack">
          <section class="card stack">
            <h2>Beitritt</h2>
            <p class="lead">Verbindung zum Raum …</p>
          </section>
        </div>`;
      }
      const names = state.players.length
        ? `<div class="roster">${listedPlayers().map((player) => `<div class="player"><span class="player-name">${esc(labelOf(player))}</span></div>`).join('')}</div>`
        : '<p class="hint">Die Namen kommen vom Host.</p>';
      return `${headerHtml()}<div class="stack">
        ${bannersHtml()}
        <section class="card stack">
          <h2>Lobby</h2>
          <p class="lead">Raum ${esc(net.roomCode || '')}. Der Host startet die Runde. Spotify bleibt auf dem Host.</p>
          <form class="stack" data-action="add-player">
            <input id="playerName" type="text" maxlength="80" placeholder="Name suchen" autocomplete="off" value="${esc(state.draftName)}" aria-label="Name suchen">
          </form>
          <div id="playerSuggestions" class="suggest"></div>
          ${names}
        </section>
      </div>`;
    }

    function lobbyModel() {
      return {
        query: state.draftName || '',
        directory: directorySource().map((player) => ({
          id: String(player.id),
          label: riotLabel(player) || player.name || player.first || ''
        })),
        seated: state.players.map((player) => ({
          id: String(player.id),
          pid: String(player.pid || ''),
          label: labelOf(player)
        })),
        startLabel: 'Spiel starten',
        startDisabled: !!(state.busy || state.players.length < 2),
        statsLabel: 'Statistik',
        rulesHtml: rulesCardHtml()
      };
    }

    function refreshRoster() {
      const el = document.getElementById('openscr-roster');
      if (!el || !window.OpenScrRoster) return false;
      window.OpenScrRoster.setModel(lobbyModel());
      return true;
    }

    function mountRoster() {
      const el = document.getElementById('openscr-roster');
      if (!el || !window.OpenScrRoster) return;
      window.OpenScrRoster.attach(el, {
        onQuery: (value) => { state.draftName = value; },
        onPick: (id) => { addSavedPlayer(id); },
        onRemove: (id) => { removePlayer(Number(id)); },
        onCreate: (draft) => {
          state.draftFirst = draft.name;
          state.draftLast = draft.tag;
          createAndAdd({ name: draft.name, tag: draft.tag, first: draft.name, last: draft.tag });
        },
        onStart: () => { startGame(); },
        onStats: () => { state.overlay = 'players'; state.error = ''; render(); }
      });
      window.OpenScrRoster.setModel(lobbyModel());
    }

    function renderSetup() {
      if (window.OpenScrRoster) {
        return `${headerHtml()}
          <div class="stack">
            ${bannersHtml()}
            ${reconnectHtml()}
            <div id="openscr-roster"></div>
          </div>`;
      }
      const players = `<div id="addedPlayers" class="roster">${listedPlayers().map((player) => playerRowHtml(player)).join('')}</div>`;
      return `${headerHtml()}
        <div class="stack">
          ${bannersHtml()}
        ${reconnectHtml()}
          <form class="stack" data-action="add-player">
            <input id="playerName" type="text" maxlength="80" placeholder="Name eingeben" autocomplete="off" autocapitalize="words" value="${esc(state.draftName)}" aria-label="Name suchen">
          </form>
          <div id="playerSuggestions" class="suggest"></div>
          ${namingFormHtml()}
          ${players}
          <button type="button" class="btn" data-action="start" ${state.busy || state.players.length < 2 ? 'disabled' : ''}>Spiel starten</button>
          <button type="button" class="linkish stats-link" data-action="open-players" aria-label="Gespeicherte Spieler">Statistik</button>
          ${rulesCardHtml()}
        </div>`;
    }

    function renderDj() {
      const minus = '<svg viewBox="0 0 512 512" aria-hidden="true" focusable="false"><path d="M400 256H112" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="32"/></svg>';
      const ranked = listedPlayers().slice().sort((a, b) => b.score - a.score || labelOf(a).localeCompare(labelOf(b), 'de'));
      const searching = new Set((net.searchers || []).map((row) => Number(row.djId)));
      const choices = ranked.map((player) => `<div class="choice-row"><button type="button" class="choice${searching.has(player.id) ? ' searching' : ''}" data-action="select-dj" data-id="${player.id}"><span>${esc(labelOf(player))}</span><span class="choice-score">${formatScore(player.score)}</span></button><button type="button" class="icon-btn" data-action="ask-remove" data-id="${player.id}" aria-label="${esc(labelOf(player))} entfernen">${minus}</button></div>`).join('');
      return `${headerHtml()}<div class="stack">
        ${bannersHtml()}
        ${reconnectHtml()}
        <section class="stack">
          ${pageTitle('Wer ist der DJ?')}
          ${choices}
          ${namesFoldHtml()}
        </section>
      </div>`;
    }

    function trackButtonHtml(track) {
      const duration = formatMs(track.durationMs);
      const meta = [track.artist, track.album, duration].filter(Boolean).join(' · ');
      const selected = state.picked && sameTrack(state.picked, track);
      const started = trackWasStarted(track.uri);
      const go = '<svg viewBox="0 0 512 512" aria-hidden="true" focusable="false"><path d="M416 128 192 384 96 288" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="32"/></svg>';
      return `<div class="track${selected ? ' selected' : ''}${started ? ' started' : ''}" data-action="pick-track" data-uri="${esc(track.uri)}" role="button" tabindex="0"><span><span class="track-title">${esc(track.title)}</span><span class="track-meta">${esc(meta)}</span></span>${started ? '<span class="played-tag">Schon an</span>' : ''}<button type="button" class="icon-btn track-go" data-action="los" data-uri="${esc(track.uri)}" aria-label="Diesen Song starten" ${state.busy ? 'disabled' : ''}>${go}</button></div>`;
    }

    function recommendationsHtml() {
      if (state.recsLoading || !state.recommendations.length) {
        if (!state.recsLoading && state.recsNote) return `<p class="hint" data-recs-note>${esc(state.recsNote)}</p>`;
        return '';
      }
      return `<div class="stack" data-recs><p class="eyebrow">Empfehlungen</p>${state.recommendations.map(trackButtonHtml).join('')}</div>`;
    }

    function renderSearch() {
      const premiumBlocked = !isGuest() && state.spotify.availability && state.spotify.availability.premium === false;
      const results = state.results.map(trackButtonHtml).join('');
      const searchLocked = state.busy || state.recsLoading;
      return `${headerHtml()}<div class="stack">
        ${bannersHtml()}
        ${reconnectHtml()}
        <section class="stack">
          ${pageTitle(esc((playerById(state.djId) ? labelOf(playerById(state.djId)) : 'Jemand') + ' sucht aus'))}
          <form class="search-field" data-action="search">
            <input id="searchQuery" type="text" placeholder="Titel oder Interpret" autocomplete="off" value="${esc(state.draftQuery)}" aria-label="Suche">
            <button class="icon-btn" type="submit" aria-label="Suchen" ${searchLocked ? 'disabled' : ''}><svg viewBox="0 0 512 512" aria-hidden="true" focusable="false"><path d="M221.09 64a157.09 157.09 0 1 0 157.09 157.09A157.1 157.1 0 0 0 221.09 64z" fill="none" stroke="currentColor" stroke-miterlimit="10" stroke-width="32"/><path d="M338.29 338.29 448 448" fill="none" stroke="currentColor" stroke-linecap="round" stroke-miterlimit="10" stroke-width="32"/></svg></button>
          </form>
          <button type="button" class="btn secondary" data-action="recommendations" ${searchLocked ? 'disabled' : ''}>${state.recsLoading ? 'Lädt …' : 'Empfehlungen'}</button>
          ${recommendationsHtml()}
          ${results || (state.recommendations.length ? '' : '<p class="hint">Noch keine Treffer.</p>')}
          ${premiumBlocked ? `<div class="banner error">${esc(NOT_PREMIUM)}</div>` : ''}
        </section>
      </div>`;
    }

    function buzzLitNow() {
      const logic = mpLogic();
      if (!net.role || !logic) return state.phase === 'guess' || state.phase === 'mark' || (Boolean(net.pressedBuzz) && state.phase === 'playing');
      const settled = state.phase === 'guess' || state.phase === 'mark' || Boolean(net.buzzDevice);
      return logic.localBuzzLit({
        pressed: net.pressedBuzz,
        settled: settled,
        winner: net.buzzDevice,
        self: net.selfId
      });
    }

    function buzzClickable() {
      if (state.phase !== 'playing' || !state.round || state.round.lock) return false;
      if (state.holdingSfx || buzzLitNow()) return false;
      if (net.role && net.localLock) return false;
      return true;
    }

    let buzzWasClickable = false;

    function armBuzzerPage() {
      const clickable = buzzClickable();
      const opened = clickable && !buzzWasClickable;
      buzzWasClickable = clickable;
      if (!opened) return false;
      state.overlay = null;
      net.localSearch = false;
      if (net.shell !== 'index') postShell('index');
      return true;
    }

    function focusBuzzer() {
      const button = document.querySelector('#app [data-action="buzz"]');
      if (!button) return;
      button.scrollIntoView({ block: 'center', inline: 'nearest', behavior: 'smooth' });
    }

    function buzzButtonHtml() {
      const lit = buzzLitNow();
      const locked = lit || state.holdingSfx || Boolean(net.role && net.localLock) || state.phase !== 'playing' || Boolean(state.round && state.round.lock);
      const ring = `<span class="timer-ring" id="roundRing" style="--p:0"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="47"></circle><circle class="prog" cx="50" cy="50" r="47"></circle></svg></span>`;
      return `<button type="button" class="buzzer${lit ? ' lit' : ''}" data-action="buzz" ${locked ? 'disabled' : ''} aria-label="${lit ? 'Gebuzzert' : 'Stopp, Song anhalten'}">${ring}${waveHtml()}<span class="buzzer-label">BUZZ</span></button>`;
    }

    function applyBuzzFace() {
      const button = document.querySelector('[data-action="buzz"]');
      if (!button) return;
      const lit = buzzLitNow();
      button.classList.toggle('lit', lit);
      const label = button.querySelector('.buzzer-label');
      if (label) label.textContent = 'BUZZ';
      button.setAttribute('aria-label', lit ? 'Gebuzzert' : 'Stopp, Song anhalten');
      button.disabled = lit || state.holdingSfx || Boolean(net.role && net.localLock) || state.phase !== 'playing' || Boolean(state.round && state.round.lock);
    }

    function waveHtml() {
      let bars = '';
      for (let i = 0; i < 28; i += 1) bars += '<span></span>';
      const paused = state.phase === 'guess' || state.phase === 'mark' ? ' paused' : '';
      return `<div class="eq${paused}" aria-hidden="true">${bars}</div>`;
    }

    function canPickOnBuzz() {
      if (state.phase !== 'guess' && state.phase !== 'mark') return false;
      if (!net.role) return true;
      return String(net.buzzDevice) === String(net.selfId);
    }

    function guessPickHtml() {
      return `<div class="stack guess-pick">${guessListHtml()}<button type="button" class="btn ghost" data-action="mistake">Versehentlich gedrückt</button></div>`;
    }

    function settleBuzzScreen() {
      if (state.phase !== 'guess' && state.phase !== 'mark') return;
      const eq = document.querySelector('#app .eq');
      if (!eq) {
        render();
        return;
      }
      eq.classList.add('paused');
      applyBuzzFace();
      const skip = document.querySelector('#app [data-action="skip"]');
      if (skip) skip.remove();
      if (clockTimer) {
        clearInterval(clockTimer);
        clockTimer = null;
      }
      const pick = document.querySelector('#app .guess-pick');
      if (pick && state.phase !== 'mark') {
        pick.querySelectorAll('.mark-slot').forEach((node) => node.remove());
      }
      const roundHead = document.querySelector('#app .round-head');
      if (roundHead) {
        const back = roundHead.querySelector('[data-action="back-name"]');
        if (backNameActs()) {
          if (!back) roundHead.insertAdjacentHTML('afterbegin', backNameButtonHtml());
        } else if (back) back.remove();
      }
      if (pick) {
        pick.querySelectorAll('.choice').forEach((button) => {
          button.classList.toggle('selected', String(button.getAttribute('data-id')) === String(state.guesserId || ''));
        });
      }
      if (canPickOnBuzz() && !pick) {
        const card = document.querySelector('#app .score-card');
        const html = guessPickHtml();
        if (card) card.outerHTML = html;
        else eq.insertAdjacentHTML('afterend', html);
        return;
      }
      if (state.phase === 'mark' && canPickOnBuzz() && pick) {
        const selected = pick.querySelector('.choice.selected');
        const slot = pick.querySelector('.mark-slot');
        if (selected && !slot) selected.insertAdjacentHTML('afterend', marksInlineHtml());
        else if (selected && slot && slot.previousElementSibling !== selected) selected.insertAdjacentElement('afterend', slot);
      }
    }

    function playingScoresHtml() {
      const ranked = listedPlayers().slice().sort((a, b) => b.score - a.score || labelOf(a).localeCompare(labelOf(b), 'de'));
      return `<div class="score-card" aria-label="Punktestand">${ranked.map((player, index) => `
        <div class="score-row"><span>${index + 1}. ${esc(labelOf(player))}</span><span>${formatScore(player.score)}</span></div>`).join('')}</div>`;
    }

    function renderPlaying() {
      const dj = state.round && playerById(state.round.djId);
      const roundNo = Math.max(1, Number(state.songsStarted) || 1);
      return `${headerHtml()}<div class="stack">
        ${bannersHtml()}
        ${reconnectHtml()}
        <section class="stage">
          <div class="round-head">
            ${backNameButtonHtml()}
            <p class="round-label">Runde ${roundNo}</p>
          </div>
          ${buzzButtonHtml()}
          ${(state.phase === 'guess' || state.phase === 'mark') && canPickOnBuzz() ? guessPickHtml() : playingScoresHtml()}
          ${namesFoldHtml()}
          <button type="button" id="resumeBtn" class="btn secondary" data-action="resume" ${state.phase === 'playing' && state.transportPaused && !state.holdingSfx ? '' : 'hidden'}>Fortsetzen</button>
          ${state.round && state.round.unconfirmed && !isGuest() ? `<div id="unconfirmed" class="stack">
            <p class="banner warn">Spotify spielt den Song noch nicht. Bitte die Box und die Verbindung prüfen. Der Titel bleibt verdeckt.</p>
            <button type="button" class="btn secondary" data-action="retry-play">Erneut von vorne starten</button>
            <button type="button" class="btn ghost" data-action="back-search">Zurück zur Suche</button>
          </div>` : ''}
        </section>
          ${state.phase === 'playing' ? `<button type="button" class="btn ghost" data-action="skip" ${state.holdingSfx || (net.role && net.localLock) ? 'disabled' : ''}>Überspringen (−3 für ${esc(dj ? labelOf(dj) : 'den DJ')})</button>` : ''}
        ${undoHtml()}
      </div>`;
    }

    function guessListHtml() {
      const dj = currentDjId();
      const ranked = listedPlayers().filter((player) => player.id !== dj).sort((a, b) => b.score - a.score || labelOf(a).localeCompare(labelOf(b), 'de'));
      return ranked.map((player) => {
        const picked = player.id === state.guesserId;
        const marks = state.phase === 'mark' && picked ? marksInlineHtml() : '';
        return `<div class="stack guess-person"><button type="button" class="choice${picked ? ' selected' : ''}" data-action="select-guesser" data-id="${player.id}"><span>${esc(labelOf(player))}</span><span class="choice-score">${formatScore(player.score)}</span></button>${marks}</div>`;
      }).join('');
    }

    function renderEndedAsk() {
      return `${headerHtml()}<div class="stack">
        ${bannersHtml()}
        ${reconnectHtml()}
        <section class="stack">
          <h2>Der Song ist zu Ende.</h2>
          <p class="lead">Wurde der Song erraten?</p>
          <button type="button" class="btn good" data-action="ended-yes">Ja</button>
          <button type="button" class="btn bad" data-action="ended-no">Nein, niemand (−3 für den DJ)</button>
        </section>
      </div>`;
    }

    function renderEndedWho() {
      const selected = playerById(state.guesserId);
      return `${headerHtml()}<div class="stack">
        ${bannersHtml()}
        ${reconnectHtml()}
        <section class="stack">
          ${pageTitle('Wer hat ihn erraten?')}
          <p class="hint">Der DJ bekommt den Punkt nicht. Falscher Name? Zurück, dann neu wählen.</p>
          ${guessListHtml()}
          <button type="button" class="btn" data-action="ended-confirm" ${selected ? '' : 'disabled'}>Punkt geben (+2)</button>
        </section>
      </div>`;
    }

    function renderReveal() {
      const round = state.round;
      const dj = round && playerById(round.djId);
      let outcome = '';
      if (round && round.outcome === 'correct') outcome = (round.outcomeWho || 'Jemand') + ' liegt richtig und bekommt +2.';
      if (round && round.outcome === 'skip') outcome = 'Übersprungen. ' + (dj ? labelOf(dj) : 'Der DJ') + ' bekommt −3.';
      if (round && round.outcome === 'ended-yes') outcome = 'Doch erraten. ' + (round.outcomeWho || 'Jemand') + ' bekommt +2.';
      if (round && round.outcome === 'ended-no') outcome = 'Nicht erraten. ' + (dj ? labelOf(dj) : 'Der DJ') + ' bekommt −3.';
      return `${headerHtml()}<div class="stack">
        ${bannersHtml()}
        ${reconnectHtml()}
        <section class="card stack">
          <p class="eyebrow">Auflösung</p>
          <h2 class="reveal-title">${esc(round ? round.secretTitle : '')}</h2>
          <p class="reveal-artist">${esc(round ? round.secretArtist : '')}</p>
          <p class="lead">${esc(outcome)}</p>
        </section>
        <p class="hint">Bitte das Handy weitergeben. Die nächste Person schaut erst drauf, wenn sie DJ ist.</p>
        ${undoHtml()}
        <button type="button" class="btn" data-action="next-dj">Nächsten DJ wählen</button>
      </div>`;
    }

    function renderFinal() {
      const ranked = state.players.slice().sort((a, b) => b.score - a.score || labelOf(a).localeCompare(labelOf(b), 'de'));
      const top = ranked[0];
      const tied = ranked.filter((player) => player.score === (top ? top.score : 0));
      const winner = top && tied.length === 1 ? labelOf(top) + ' gewinnt.' : 'Gleichstand an der Spitze.';
      return `${headerHtml()}<div class="stack">
        ${bannersHtml()}
        ${reconnectHtml()}
        <section class="card">
          <h2>Endstand</h2>
          <p class="lead">${state.players.length ? esc(winner) : 'Keine Mitspieler.'}</p>
          <p class="hint">${state.songsStarted} ${state.songsStarted === 1 ? 'Song wurde' : 'Songs wurden'} gestartet.</p>
          ${ranked.map((player, index) => `<div class="rank"><span>${index + 1}. ${esc(labelOf(player))}</span><strong>${formatScore(player.score)}</strong></div>`).join('')}
        </section>
      </div>`;
    }

    function formatSec(value) {
      if (typeof value !== 'number' || !isFinite(value)) return '–';
      return value.toFixed(1).replace('.', ',') + ' s';
    }

    function sortedRegistry() {
      const api = playerApi();
      return registry.slice().sort((a, b) => {
        const left = api ? api.normalize((a.first || '') + ' ' + (a.last || '')) : ((a.first || '') + ' ' + (a.last || ''));
        const right = api ? api.normalize((b.first || '') + ' ' + (b.last || '')) : ((b.first || '') + ' ' + (b.last || ''));
        return left.localeCompare(right, 'de') || String(a.id).localeCompare(String(b.id));
      });
    }

    function personTitle(player) {
      if (!player) return 'Unbekannt';
      return riotLabel(player) || (player.first + ' ' + player.last).trim() || player.first || 'Unbekannt';
    }

    function renderPlayerDirectory() {
      const rows = sortedRegistry();
      const list = rows.length
        ? rows.map((player) => `<button type="button" class="choice" data-action="open-stats" data-pid="${esc(player.id)}"><span><span class="player-name">${esc(personTitle(player))}</span><span class="track-meta">Allzeit-Statistik</span></span></button>`).join('')
        : '<p class="hint">Noch niemand gespeichert. In der Lobby legt ihr eine Person mit Vor- und Nachname an.</p>';
      return `${headerHtml()}<div class="stack">
        ${bannersHtml()}
        <button type="button" class="btn ghost" data-action="back-overlay">Zurück</button>
        <section class="card stack">
          <h2>Gespeicherte Spieler</h2>
          <p class="hint">Die Liste liegt auf diesem Handy. Ein Tipp öffnet die Statistik. Entfernen aus der Runde löscht niemanden hier.</p>
          ${list}
        </section>
      </div>`;
    }

    function renderPlayerStats() {
      const record = registry.find((player) => player.id === state.statsPid);
      const api = statsApi();
      const data = record && api ? api.statsFor(historyDoc || api.emptyHistory(), record.id) : null;
      const archived = Boolean(historyDoc && historyDoc.archive && record && historyDoc.archive[record.id]);
      const djSongs = data && data.djSongs.length
        ? data.djSongs.map((row) => `<div class="stat-item"><span class="player-name">${esc(row.title || 'Unbekannter Titel')}</span><span class="track-meta">${esc(row.artist || '')}</span><span class="hint">${esc(row.count + '×')}</span></div>`).join('')
        : '<p class="hint">Noch keine Songs aufgelegt.</p>';
      const guessed = data && data.guessed.length
        ? data.guessed.map((row) => {
          const times = (row.seconds || []).map(formatSec);
          const bits = [row.count + '×'];
          if (row.average != null) bits.push('Ø ' + formatSec(row.average));
          if (times.length) bits.push(times.join(', '));
          if (archived && times.length < row.count) bits.push('ältere Einzelzeiten nur in der Summe');
          return `<div class="stat-item"><span class="player-name">${esc(row.title || 'Unbekannter Titel')}</span><span class="track-meta">${esc(row.artist || '')}</span><span class="hint">${esc(bits.join(' · '))}</span></div>`;
        }).join('')
        : '<p class="hint">Noch nichts erraten.</p>';
      const points = data ? formatScore(data.points) : '0';
      const games = data ? data.games : 0;
      const wins = data ? data.wins : 0;
      return `${headerHtml()}<div class="stack">
        ${bannersHtml()}
        <button type="button" class="btn ghost" data-action="back-overlay">Zurück</button>
        <section class="card stack">
          <p class="eyebrow">Allzeit</p>
          <h2>${esc(personTitle(record))}</h2>
          <div class="rank"><span>Punkte</span><strong>${esc(points)}</strong></div>
          <div class="rank"><span>Spiele</span><strong>${games}</strong></div>
          <div class="rank"><span>Siege</span><strong>${wins}</strong></div>
          <p class="hint">Ein Sieg zählt nur, wenn niemand sonst gleich viele Punkte hat. Alles wird aus den Spielprotokollen berechnet.</p>
        </section>
        <section class="card stack">
          <h2>Als DJ aufgelegt</h2>
          <div class="stat-list">${djSongs}</div>
        </section>
        <section class="card stack">
          <h2>Erraten</h2>
          <div class="stat-list">${guessed}</div>

      const ms = guessing && state.round.pendingSec != null ? state.round.pendingSec * 1000 : roundElapsedMs();
      const dur = Number(state.round.durationMs) || 0;
      const p = dur > 0 ? Math.max(0, Math.min(1, ms / dur)) : 0;
      if (ring) ring.style.setProperty('--p', String(p));
    }

      return storage;

    function withTimeout(promise, ms) {
      return new Promise((resolve, reject) => {
        const timer = setTimeout(() => reject(new Error('timeout')), ms);
        Promise.resolve(promise).then((value) => {
          clearTimeout(timer);
          resolve(value);
        }, (error) => {
          clearTimeout(timer);
          reject(error);
        });
      });
    }

        return { ok: true, value: value == null ? null : value };

    function parseSaved(raw) {
      if (raw == null || raw === '') return null;

      if (typeof raw === 'string') {
        try { saved = JSON.parse(raw); } catch (error) { return null; }
      }
      if (!saved || typeof saved !== 'object') return null;
      return saved;

    function snapshotRaw() {

    async function writeBridgeRaw(key, raw) {
      const storage = persistentStore();
      if (!storage) return;
      try {
        if (raw == null) await withTimeout(storage.remove(key), STORAGE_TIMEOUT_MS);
        else await withTimeout(storage.set(key, String(raw)), STORAGE_TIMEOUT_MS);
      } catch (error) {
        // Bridge fehlt, storage ist nicht erlaubt, oder der Aufruf kommt nicht zurück.
      }
    }

    function writeLocalRaw(key, raw) {
      try {
        if (raw == null) localStorage.removeItem(key);
        else localStorage.setItem(key, String(raw));
      } catch (error) {
        // localStorage kann voll oder gesperrt sein. Der OpenScr-Speicher bleibt die Quelle.
      }

    function asText(value) {

    function restorePlayers(list) {
      if (!Array.isArray(list)) return [];
      return list.map((player) => {
        const id = Number(player && player.id);
        const name = asText(player && player.name).trim().slice(0, 80);
        const first = asText(player && player.first).trim().slice(0, 40);
        const last = asText(player && player.last).trim().slice(0, 40);
        const pid = asText(player && player.pid).trim();
        if (!id || !(name || first)) return null;
        return {
          id: id,
          pid: pid,
          name: name || (first + ' ' + last).trim(),
          first: first,
          last: last,
          score: Number(player && player.score) || 0

      }).filter(Boolean);
    }

    function restoreSession(raw) {
      if (!raw || typeof raw !== 'object' || typeof raw.id !== 'string' || !Array.isArray(raw.events)) return null;
      return {
        id: raw.id,
        start: Number(raw.start) || Date.now(),
        end: Number(raw.end) || 0,
        players: Array.isArray(raw.players) ? raw.players.filter((id) => typeof id === 'string') : [],
        events: raw.events.filter((event) => event && typeof event === 'object'),
        full: raw.full !== false

      if (!saved || saved.v !== 1 || !Array.isArray(saved.players)) return [];

        first: asText(player && player.first).trim(),

    function validRound(round, players) {
      if (!round || typeof round !== 'object') return false;

    async function restoreLobby() {
      let saved = null;
      try {
        const raw = await readLobbyRaw();
        if (raw == null || raw === '') return false;
        saved = parseSaved(raw);
      } catch (error) {
        return false;
      }
      if (!saved || typeof saved !== 'object' || saved.v !== 1 || inGamePhase(saved.phase)) return false;
      const players = restorePlayers(saved.players).map((player) => ({
        id: player.id,
        pid: player.pid,
        name: player.name,
        first: player.first,
        last: player.last,
        score: 0
      }));
      state.players = players;
      const maxId = players.reduce((max, player) => Math.max(max, player.id), 0);
      state.nextId = Math.max(Number(saved.nextId) || 1, maxId + 1);
      state.draftName = asText(saved.draftName).slice(0, 80);
      state.session = null;
      state.phase = 'setup';
      state.djId = null;
      state.round = null;
      state.picked = null;
      state.results = [];
      state.guesserId = null;
      state.songsStarted = 0;
      state.startedUris = [];
      state.shownRecommendationUris = [];
      state.confirmEnd = false;
      state.resumeAfterReconnect = false;

    async function restoreGame() {
      let restored = false;
      try {
        restored = await restoreInProgress();
      } catch (error) {
        restored = false;
      }
      if (!restored) await restoreLobby();
      return restored;
    }

    async function restoreInProgress() {
      let saved = null;
      try {
        const bridgeResult = await readBridgeValue();
        bridgeReadOk = bridgeResult.ok;
        const bridgeHas = bridgeResult.ok && bridgeResult.value != null && bridgeResult.value !== '';
        const raw = bridgeHas ? bridgeResult.value : readLocalRaw();
        if (raw == null || raw === '') return false;
        saved = parseSaved(raw);
      } catch (error) {
        return false;
      }
      if (!saved || typeof saved !== 'object' || !inGamePhase(saved.phase)) {
        await writeSavedRaw(null, bridgeReadOk);
        return false;
      }
      const players = restorePlayers(saved.players);
      if (players.length < 2) {
        await writeSavedRaw(null, bridgeReadOk);
        return false;
      }
      state.players = players;
      const maxId = players.reduce((max, player) => Math.max(max, player.id), 0);
      state.nextId = Math.max(Number(saved.nextId) || 1, maxId + 1);
      state.djId = players.some((player) => player.id === saved.djId) ? saved.djId : null;
      state.round = validRound(saved.round, players) ? saved.round : null;
      state.picked = saved.picked && trackUriOf(saved.picked).indexOf('spotify:track:') === 0 ? saved.picked : null;
      state.results = restoreTracks(saved.results);
      state.draftName = asText(saved.draftName).slice(0, 80);
      state.draftQuery = asText(saved.draftQuery).slice(0, 200);
      state.session = restoreSession(saved.session);
      state.guesserId = players.some((player) => player.id === saved.guesserId) ? saved.guesserId : null;
      state.error = asText(saved.error);
      state.info = asText(saved.info) === 'Wer das Handy hält, ist der DJ und sucht den Song aus.' ? '' : asText(saved.info);
      state.notice = asText(saved.notice);
      state.confirmEnd = Boolean(saved.confirmEnd);
      state.transportPaused = Boolean(saved.transportPaused);
      state.songsStarted = Math.max(0, Number(saved.songsStarted) || 0);
      state.startedUris = Array.isArray(saved.startedUris) ? saved.startedUris : [];
      if (Array.isArray(saved.shownRecommendationUris)) state.shownRecommendationUris = saved.shownRecommendationUris;
      if (Array.isArray(saved.recommendations)) state.recommendations = restoreTracks(saved.recommendations);
      state.recsLoading = false;
      state.recsReady = Boolean(saved.recsReady);
      state.recsNote = asText(saved.recsNote);
      state.busy = false;
      state.phase = saved.phase;
      const roundPhases = ['playing', 'guess', 'mark', 'endedAsk', 'endedWho', 'reveal'];
      if (roundPhases.indexOf(state.phase) !== -1 && !state.round) {
        state.phase = state.djId ? 'search' : 'dj';
      }
      if (state.phase === 'search' && !state.djId) state.phase = 'dj';
      if (state.phase === 'playing' && state.round) {
        state.round.holdEnd = true;
        if (!state.round.lock && !state.transportPaused) state.resumeAfterReconnect = true;
      }
      state.dropNoted = spotifyDropped();
      return true;
    }

    function wakeVideoEl() {
      return document.getElementById('wakeVideo');
    }

    function wakeVideoPlaying() {
      const video = wakeVideoEl();
      return Boolean(video && !video.paused && video.currentTime >= 0 && video.readyState > 0);
    }

    function setWakeDebug(mode) {
      wakeMode = mode;
      document.documentElement.dataset.wake = mode;
      const el = document.getElementById('wakeDebug');
      if (!el) return;
      const label = mode === 'bridge' ? 'Wach: Bridge'
        : mode === 'screen' ? 'Wach: Wake Lock'
        : mode === 'video' ? 'Wach: Video'
        : mode === 'pending' ? 'Wach: wartet'
        : '';
      el.textContent = label;
      if (label) el.removeAttribute('hidden');
      else el.setAttribute('hidden', '');
    }

    function canTryWakeLock() {
      return Boolean(navigator.wakeLock && typeof navigator.wakeLock.request === 'function');
    }

    function pauseWakeVideo() {
      const video = wakeVideoEl();
      if (!video) return;
      try { video.pause(); } catch (error) {}
    }

    function releaseScreenLock() {
      const lock = screenLock;
      screenLock = null;
      if (lock && !lock.released) lock.release().catch(function () {});
    }

    function bridgeBag(name) {
      const api = bridge();
      if (!api) return null;
      try {
        const bag = api[name];
        return bag && typeof bag === 'object' ? bag : null;
      } catch (error) {
        return null;
      }
    }

    function keepAwakeControls() {
      const pairs = [
        ['keepAwake', 'acquire', 'release', false],
        ['keepAwake', 'enable', 'disable', false],
        ['wake', 'acquire', 'release', false],
        ['wake', 'enable', 'disable', false],
        ['screen', 'keepAwake', 'release', true]
      ];
      for (let i = 0; i < pairs.length; i += 1) {
        const bag = bridgeBag(pairs[i][0]);
        if (bag && typeof bag[pairs[i][1]] === 'function') {
          return { bag: bag, on: pairs[i][1], off: pairs[i][2], flag: pairs[i][3] };
        }
      }
      return null;
    }

    function callKeep(bag, name, useFlag, on) {
      if (!bag || typeof bag[name] !== 'function') return false;
      try {
        const result = useFlag ? bag[name](Boolean(on)) : bag[name]();
        if (result && typeof result.then === 'function') result.then(function () {}, function () {});
        return true;
      } catch (error) {
        return false;
      }
    }

    function releaseAwake() {
      wakeWanted = false;
      if (bridgeHeld) {
        const ctl = keepAwakeControls();
        if (ctl) callKeep(ctl.bag, ctl.off, ctl.flag, false);
        bridgeHeld = false;
      }
      releaseScreenLock();
      pauseWakeVideo();
      setWakeDebug('off');
    }

    function playWakeVideo() {
      if (focusedTypingField()) return;
      const video = wakeVideoEl();
      if (!video) {
        setWakeDebug('pending');
        return;
      }
      video.muted = true;
      video.defaultMuted = true;
      video.volume = 0;
      video.loop = true;
      video.playsInline = true;
      const played = video.play();
      const settled = (ok) => {
        if (!wakeWanted) {
          pauseWakeVideo();
          return;
        }
        if (screenLock && !screenLock.released) return;
        setWakeDebug(ok && !video.paused ? 'video' : 'pending');
      };
      if (played && typeof played.then === 'function') played.then(function () { settled(true); }, function () { settled(false); });
      else settled(!video.paused);
    }

    function requestAwake(fromGesture) {
      wakeWanted = true;
      if (document.visibilityState === 'hidden') return;
      if (!bridgeHeld) {
        const ctl = keepAwakeControls();
        if (ctl && callKeep(ctl.bag, ctl.on, ctl.flag, true)) {
          bridgeHeld = true;
          releaseScreenLock();
          pauseWakeVideo();
          setWakeDebug('bridge');
          return;
        }
      } else {
        setWakeDebug('bridge');
        return;
      }
      if (screenLock && !screenLock.released) {
        setWakeDebug('screen');
        return;
      }
      if (canTryWakeLock()) {
        let pending;
        try {
          pending = navigator.wakeLock.request('screen');
        } catch (error) {
          pending = Promise.reject(error);
        }
        Promise.resolve(pending).then((lock) => {
          if (!wakeWanted || document.visibilityState === 'hidden' || (screenLock && !screenLock.released)) {
            if (lock && !lock.released) lock.release().catch(function () {});
            return;
          }
          screenLock = lock;
          lock.addEventListener('release', () => {
            if (screenLock !== lock) return;
            screenLock = null;
            if (!wakeWanted || document.visibilityState !== 'visible') return;
            requestAwake(false);
          });
          pauseWakeVideo();
          setWakeDebug('screen');
        }, () => {
          if (!wakeWanted) return;
          if (wakeVideoPlaying()) {
            setWakeDebug('video');
            return;
          }
          if (fromGesture) playWakeVideo();
          else setWakeDebug('pending');
        });
        return;
      }
      if (wakeVideoPlaying()) {
        setWakeDebug('video');
        return;
      }
      if (fromGesture) playWakeVideo();
      else setWakeDebug('pending');
    }

    function screenStayOn() {
      return !wakeDismissed && IN_GAME_PHASES.indexOf(state.phase) !== -1;
    }

    function syncScreenWake(fromGesture) {
      if (screenStayOn()) requestAwake(Boolean(fromGesture));
      else if (wakeWanted || screenLock || wakeMode !== 'off') releaseAwake();
    }

    function bindWakeVideo() {
      const video = wakeVideoEl();
      if (!video || video.dataset.bound) return;
      video.dataset.bound = '1';
      video.muted = true;
      video.defaultMuted = true;
      video.volume = 0;
      video.addEventListener('ended', () => {
        if (!wakeWanted || (screenLock && !screenLock.released)) return;
        const again = video.play();
        if (again && typeof again.catch === 'function') again.catch(function () { setWakeDebug('pending'); });
      });
    }

      app.addEventListener('pointerdown', (event) => {
        const button = event.target && event.target.closest && event.target.closest('#playerSuggestions [data-action="add-saved"]');
        const remove = event.target && event.target.closest && event.target.closest('#playerSuggestions [data-action="remove-player"]');
        suggestButton = button || null;
        suggestRemove = remove || null;
        suggestMoved = false;
        if (button) button.classList.add('pressed');
        if (remove) remove.classList.add('pressed');
      });

        const button = suggestButton;
        suggestButton = null;
        if (!button || suggestMoved) return;

          window.setTimeout(() => button.classList.remove('pressed'), 160);
          return;
        }
        suggestPick = true;
        addSavedPlayer(button.dataset.pid);
      });
      app.addEventListener('touchstart', (event) => {
        const hit = event.target && event.target.closest && event.target.closest('#playerSuggestions');
        if (!hit || !event.touches.length) return;
        box = hit;
        lastY = event.touches[0].clientY;
        moved = false;
        suggestMoved = false;
      }, { passive: true });
      app.addEventListener('touchmove', (event) => {
        if (!box || !event.touches.length) return;
        const y = event.touches[0].clientY;
        const dy = lastY - y;
        if (Math.abs(dy) > 8) {
          moved = true;
          suggestMoved = true;
          if (suggestButton) suggestButton.classList.remove('pressed');
          if (suggestRemove) suggestRemove.classList.remove('pressed');
        }
        lastY = y;
        box.scrollTop += dy;
        if (event.cancelable) event.preventDefault();
      }, { passive: false });
      const end = (event) => {
        if (box && moved && event.cancelable) event.preventDefault();
        box = null;
      };
      app.addEventListener('touchend', end, { passive: false });
      app.addEventListener('touchcancel', end, { passive: false });
    }
